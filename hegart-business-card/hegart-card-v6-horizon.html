<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hegart Studio Visitenkarte V6</title>
<style>
  /* 85 × 55 mm trim + 3 mm bleed — flat colours only, no gradients */
  :root{--bleed:3mm;--w:85mm;--h:55mm}
  .paper   {--bg:#F2F1EC;--fg:#141413;--mute:#6B6A66;--line:rgba(20,20,19,.10);--ac:#0047FF;--tile:#141413;--tilefg:#F2F1EC}
  .noir    {--bg:#0B0B0C;--fg:#F5F5F2;--mute:#8A8A86;--line:rgba(245,245,242,.07);--ac:#C8FF2E;--tile:#F5F5F2;--tilefg:#0B0B0C}
  .electric{--bg:#1C34FF;--fg:#FFFFFF;--mute:#B9C2FF;--line:rgba(255,255,255,.12);--ac:#FF5A1F;--tile:#FFFFFF;--tilefg:#1C34FF}

  @page{size:91mm 61mm;margin:0}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#2a2c31}
  body{font-family:"Inter",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet{display:flex;flex-direction:column;gap:10mm;align-items:center;padding:10mm}
  @media print{.sheet{padding:0;gap:0} html,body{background:none}}

  .card{position:relative;width:calc(var(--w) + 2*var(--bleed));height:calc(var(--h) + 2*var(--bleed));
        overflow:hidden;break-after:page;background:var(--bg);color:var(--fg)}
  .safe{position:absolute;inset:calc(var(--bleed) + 3.5mm)}
  .mono{font-family:"JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase}
  .ac{color:var(--ac)}
  .mark{display:block;color:var(--fg);overflow:visible}

  /* thin flat grid lines drawn as real elements */
  .grid{position:absolute;inset:0;pointer-events:none}
  .grid line{stroke:var(--line);stroke-width:.25}

  /* ===== FRONT A · Swiss (paper) ===== */
  .fa .mark{width:15mm;height:auto}
  .fa .top{display:flex;justify-content:space-between;align-items:flex-start}
  .fa .idx{font-size:4.6pt;color:var(--mute);text-align:right;line-height:1.75}
  .fa .bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end}
  .fa .name{font-family:"Inter Display","Inter",sans-serif;font-weight:600;font-size:17pt;letter-spacing:.02em;line-height:.9}
  .fa .sub{font-size:5pt;margin-top:2mm;letter-spacing:.5em}
  .fa .dot{display:inline-block;width:1.6mm;height:1.6mm;background:var(--ac);margin-left:1mm;vertical-align:.2mm}
  .fa .svc{font-size:4.6pt;color:var(--mute);text-align:right;line-height:1.75}
  .fa .bar{position:absolute;left:0;right:0;top:20.5mm;height:.25mm;background:var(--fg)}
  .fa .bar::after{content:"";position:absolute;left:0;top:-.5mm;width:12mm;height:1.25mm;background:var(--ac)}

  /* ===== FRONT B · Cropped monogram (noir) ===== */
  .fb .giant{position:absolute;right:-17mm;top:50%;transform:translateY(-50%);width:62mm;height:auto;color:#232326}
  .fb .left{position:absolute;left:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between}
  .fb .tag{font-size:4.6pt;color:var(--mute)}
  .fb .tag b{color:var(--ac);font-weight:500}
  .fb .name{font-family:"Inter Display","Inter",sans-serif;font-weight:300;font-size:13pt;letter-spacing:.42em}
  .fb .sub{font-size:5pt;margin-top:1.8mm;letter-spacing:.62em;color:var(--ac)}
  .fb .coord{font-size:4.6pt;color:var(--mute);line-height:1.75}

  /* ===== FRONT C · Centered block (electric) ===== */
  .fc .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .fc .mark{width:17mm;height:auto}
  .fc .name{margin-top:4.5mm;font-family:"Inter Display","Inter",sans-serif;font-weight:700;font-size:12pt;letter-spacing:.5em;margin-right:-.5em}
  .fc .sub{margin-top:1.8mm;font-size:5pt;letter-spacing:.7em;margin-right:-.7em}
  .fc .chip{position:absolute;top:0;left:0;font-size:4.6pt;background:var(--fg);color:var(--bg);padding:.7mm 1.6mm}
  .fc .chip2{position:absolute;top:0;right:0;font-size:4.6pt;color:var(--fg);border:.2mm solid var(--fg);padding:.5mm 1.4mm}
  .fc .foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font-size:4.6pt;color:var(--mute)}
  .fc .sq{position:absolute;width:2.2mm;height:2.2mm;background:var(--ac)}

  /* ===== BACK (shared) ===== */
  .back .safe{display:grid;grid-template-columns:1fr auto;column-gap:5mm}
  .back .left{display:flex;flex-direction:column;justify-content:space-between;padding:1mm 0 .5mm 1mm}
  .back .head{display:flex;align-items:center;gap:2.6mm}
  .back .head .mark{width:7mm;height:auto}
  .back .t1{font-family:"Inter Display","Inter",sans-serif;font-weight:600;font-size:8.2pt;letter-spacing:.3em}
  .back .t2{font-size:4.1pt;color:var(--mute);margin-top:.9mm;letter-spacing:.12em;white-space:nowrap}
  .rows{display:grid;grid-template-columns:6mm 1fr;row-gap:1.55mm;align-items:baseline}
  .rows dt{font-family:"JetBrains Mono",monospace;font-size:4.4pt;color:var(--ac);letter-spacing:.1em;font-weight:500}
  .rows dd{font-size:6.4pt;letter-spacing:.02em;white-space:nowrap}
  .rows dd small{display:block;font-size:6.4pt}
  .services{font-size:4pt;color:var(--mute);letter-spacing:.1em;white-space:nowrap}
  .back .right{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2mm;padding-left:5mm;border-left:.2mm solid var(--fg)}
  .qr{width:19mm;height:19mm;padding:1.6mm;background:var(--tilefg)}
  .paper .qr{background:#FFFFFF;outline:.2mm solid var(--fg)}
  .qr svg{display:block;width:100%;height:100%}
  .qr path{fill:var(--qrfg,#0B0B0C)}
  .paper .qr path{fill:#141413} .electric .qr path{fill:#0B0B0C} .electric .qr{background:#FFFFFF}
  .noir .qr{background:#F5F5F2}
  .qrcap{font-size:4.2pt;color:var(--mute);text-align:center;line-height:1.6}
  .qrcap b{color:var(--fg);font-weight:600}
  .electric .rows dt{color:var(--fg);opacity:.7}

  .iso3d   {--bg:#E7E5E0;--fg:#141413;--mute:#6B6A66;--line:rgba(20,20,19,.08);--ac:#FF4A12;--tile:#141413;--tilefg:#F2F1EC}
  .horizon {--bg:#06060D;--fg:#FFFFFF;--mute:#8F96B8;--line:rgba(94,231,255,.08);--ac:#5EE7FF;--tile:#FFFFFF;--tilefg:#06060D}
  .emboss  {--bg:#13233A;--fg:#E8EEF6;--mute:#7F93AF;--line:rgba(255,255,255,.05);--ac:#5EE7FF;--tile:#E8EEF6;--tilefg:#13233A}

  /* V5 iso */
  .f5 .iso{position:absolute;left:1mm;top:50%;transform:translateY(-50%);width:33mm;height:auto;overflow:visible}
  .f5 .shadow{position:absolute;left:4mm;bottom:3.2mm;width:34mm;height:2.2mm;background:rgba(20,20,19,.16);transform:skewX(-45deg)}
  .f5 .txt{position:absolute;right:1mm;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;text-align:right}
  .f5 .tag{font-size:4.6pt;color:var(--mute)}
  .f5 .name{font-family:"Inter Display","Inter",sans-serif;font-weight:800;font-size:15pt;letter-spacing:.04em;
            text-shadow:0.07mm -0.07mm 0 #5E5C57,0.14mm -0.14mm 0 #5E5C57,0.21mm -0.21mm 0 #5E5C57,0.28mm -0.28mm 0 #5E5C57,0.35mm -0.35mm 0 #5E5C57}
  .f5 .sub{font-size:5pt;letter-spacing:.55em;margin-top:2.2mm;margin-right:-.55em}
  .f5 .sub b{color:var(--ac);font-weight:600}
  .f5 .svc{font-size:4.4pt;color:var(--mute);line-height:1.75}

  /* V6 horizon */
  .floor{position:absolute;inset:0;width:100%;height:100%}
  .f6 .stack{position:absolute;left:50%;top:1.5mm;width:15mm;height:13.6mm;transform:translateX(-50%)}
  .f6 .stack .mark{position:absolute;left:0;top:0;width:15mm;height:auto}
  .f6 .stack .layer{color:#1B6F80;--ac:#1B6F80}
  .f6 .stack .top{color:#FFFFFF}
  .f6 .name{position:absolute;left:0;right:0;top:20.5mm;text-align:center;font-family:"Inter Display","Inter",sans-serif;font-weight:800;font-size:13pt;letter-spacing:.42em;margin-right:-.42em;
            text-shadow:0 .2mm 0 #5EE7FF,0 .4mm 0 #3BB5CC,0 .6mm 0 #2A8BA0,0 .8mm 0 #1B6F80,0 1mm 0 #134E5B}
  .f6 .sub{position:absolute;left:0;right:0;top:27.6mm;text-align:center;font-size:4.8pt;letter-spacing:.7em;margin-right:-.7em;color:var(--ac)}
  .f6 .c{position:absolute;bottom:0;font-size:4.4pt;color:#B9F5FF}
  .f6 .c.l{left:0} .f6 .c.r{right:0}
  .horizon .back .right{border-left-color:var(--ac)}

  /* V7 emboss */
  .f7 .mark{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:27mm;height:auto;color:#1B3150;--ac:#5EE7FF;
            filter:drop-shadow(-.35mm -.35mm .25mm rgba(255,255,255,.22)) drop-shadow(.5mm .6mm .45mm rgba(0,0,0,.55))}
  .f7 .name{position:absolute;left:0;right:0;bottom:4.5mm;text-align:center;font-family:"Inter Display","Inter",sans-serif;font-weight:700;font-size:10pt;letter-spacing:.6em;margin-right:-.6em;
            color:var(--fg);text-shadow:-.12mm -.12mm .08mm rgba(255,255,255,.35),.3mm .35mm .3mm rgba(0,0,0,.7)}
  .f7 .sub{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:4.6pt;color:var(--mute);letter-spacing:.7em;margin-right:-.7em}
  .f7 .pill{position:absolute;top:0;font-size:4.4pt;color:var(--mute);padding:.7mm 1.8mm;border-radius:3mm;
            box-shadow:inset .25mm .25mm .4mm rgba(0,0,0,.5),inset -.25mm -.25mm .4mm rgba(255,255,255,.08)}
  .f7 .pill.l{left:0} .f7 .pill.r{right:0}
  .emboss .back .qr{box-shadow:-.3mm -.3mm .5mm rgba(255,255,255,.12),.6mm .7mm 1mm rgba(0,0,0,.55)}
  .emboss .back .head .mark{filter:drop-shadow(.3mm .35mm .25mm rgba(0,0,0,.6))}

  .iso3d .qr,.horizon .qr,.emboss .qr{background:#FFFFFF}
  /* hard 3D offset shadows on back QR tiles */
  .iso3d .back .qr{outline:none;box-shadow:.6mm -.6mm 0 #9A978F,1.2mm -1.2mm 0 #6E6C66}
  .horizon .back .qr{box-shadow:0 .5mm 0 #5EE7FF,0 1mm 0 #1B6F80}
</style>
