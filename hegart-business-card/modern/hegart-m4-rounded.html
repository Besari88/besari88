<style>
:root{--navy:#0D1B2E;--night:#070E1A;--cream:#FCF6EC;--ink:#0B0B0C;--blue:#0589C2;--mint:#05E19F;--paper:#F4F4F1;--b:3mm}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#3a3a3a}
body{font-family:"Inter",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-feature-settings:"ss01","cv11"}
.sheet{display:flex;flex-direction:column;gap:10mm;align-items:center;padding:10mm}
@media print{.sheet{padding:0;gap:0}html,body{background:none}}
.card{position:relative;overflow:hidden;break-after:page;width:calc(var(--W) + 2*var(--b));height:calc(var(--H) + 2*var(--b))}
.safe{position:absolute;inset:calc(var(--b) + 4mm)}
.abs{position:absolute}
.disp{font-family:"Inter Display","Inter",sans-serif;font-weight:800;letter-spacing:-.045em;line-height:.8}
.lbl{font-size:4.8pt;font-weight:500;letter-spacing:.01em}
.mark{display:block;overflow:visible}
.qr svg{display:block;width:100%;height:100%}
.trim{position:absolute;inset:var(--b)}

@page{size:91mm 61mm;margin:0}
.card{--W:85mm;--H:55mm}

 .f{background:var(--navy);color:#fff}
 .f .mk{left:0;top:0;width:7mm;color:#fff;--bar:var(--mint)}
 .f .st{right:0;top:.4mm;display:flex;align-items:center;gap:1.3mm}
 .f .st .dot{width:1.6mm;height:1.6mm;border-radius:50%;background:var(--mint)}
 .f .nm{left:0;top:12.5mm;font-family:"Inter Display";font-weight:800;font-size:21pt;letter-spacing:-.045em;line-height:.9}
 .f .nm span{color:rgba(255,255,255,.45)}
 .f .tags{left:0;bottom:0;display:flex;flex-wrap:wrap;gap:1.2mm;width:48mm}
 .f .tags span{font-size:5.4pt;font-weight:500;padding:1mm 2.3mm;border:.2mm solid rgba(255,255,255,.45);border-radius:9mm}
 .f .btn{right:0;bottom:0;background:var(--mint);color:var(--ink);font-size:6pt;font-weight:700;padding:1.9mm 3mm;border-radius:9mm}
 .b{background:var(--paper);color:var(--ink)}
 .b .card-in{position:absolute;left:0;top:0;bottom:0;width:24mm;background:#fff;border-radius:2.8mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6mm}
 .b .qr{width:17mm;height:17mm}
 .b .card-in .lbl{color:#555}
 .b .info{left:28mm;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between}
 .b .nm{font-family:"Inter Display";font-weight:800;font-size:10.5pt;letter-spacing:-.035em;display:flex;align-items:center;gap:2mm}
 .b .nm .mark{width:5mm;color:var(--ink);--bar:var(--blue)}
 .b .rows{display:grid;grid-template-columns:auto 1fr;column-gap:3mm;row-gap:1.1mm;font-size:6pt;align-items:baseline}
 .b .rows i{font-style:normal;font-size:4.6pt;font-weight:600;color:var(--blue)}
.card .trim-clip{position:absolute;inset:var(--b);border-radius:3mm;box-shadow:0 0 0 .1mm rgba(255,0,255,.0)}</style></head><body><svg width="0" height="0" style="position:absolute"><defs>
