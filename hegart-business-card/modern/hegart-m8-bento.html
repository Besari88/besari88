<style>
:root{--navy:#0D1B2E;--night:#070E1A;--cream:#FCF6EC;--ink:#0B0B0C;--blue:#0589C2;--mint:#05E19F;--paper:#F4F4F1;--b:3mm}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#3a3a3a}
body{font-family:"Inter",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-feature-settings:"ss01","cv11"}
.sheet{display:flex;flex-direction:column;gap:10mm;align-items:center;padding:10mm}
@media print{.sheet{padding:0;gap:0}html,body{background:none}}
.card{position:relative;overflow:hidden;break-after:page;width:calc(var(--W) + 2*var(--b));height:calc(var(--H) + 2*var(--b))}
.safe{position:absolute;inset:calc(var(--b) + 4mm)}
.abs{position:absolute}
.disp{font-family:"Inter Display","Inter",sans-serif;font-weight:800;letter-spacing:-.045em;line-height:.8}
.lbl{font-size:4.8pt;font-weight:500;letter-spacing:.01em}
.mark{display:block;overflow:visible}
.qr svg{display:block;width:100%;height:100%}
.trim{position:absolute;inset:var(--b)}

@page{size:91mm 61mm;margin:0}
.card{--W:85mm;--H:55mm}

 .f,.b{background:#E7E6E1}
 .bento{position:absolute;inset:calc(var(--b) + 2.4mm);display:grid;gap:1.3mm}
 .tile{border-radius:2.2mm;position:relative;overflow:hidden;padding:2.4mm}
 .f .bento{grid-template-columns:1fr 1fr 1.05fr;grid-template-rows:1.15fr 1fr}
 .f .t1{grid-column:1/3;background:var(--navy);color:#fff;display:flex;flex-direction:column;justify-content:space-between}
 .f .t1 .nm{font-family:"Inter Display";font-weight:800;font-size:15pt;letter-spacing:-.045em;line-height:.88}
 .f .t1 .lbl{color:rgba(255,255,255,.6)}
 .f .t2{grid-row:1/3;grid-column:3;background:url(../assets/photos/granatapfel.jpg) 40% 35%/cover}
 .f .t3{background:var(--mint);display:flex;align-items:center;justify-content:center}
 .f .t3 .mark{width:11mm;color:var(--ink)}
 .f .t4{background:#fff;color:var(--ink);font-size:5.6pt;font-weight:600;line-height:1.38;display:flex;flex-direction:column;justify-content:flex-end}
 .b .bento{grid-template-columns:1fr 1.3fr 1.3fr;grid-template-rows:1fr 1fr}
 .b .q{grid-row:1/3;background:#fff;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
 .b .q .qr{width:100%;aspect-ratio:1}
 .b .q .lbl{font-weight:700;color:var(--ink)}
 .b .tel{grid-column:2/4;background:var(--blue);color:#fff;display:flex;flex-direction:column;justify-content:space-between}
 .b .tel .n{font-family:"Inter Display";font-weight:700;font-size:13pt;letter-spacing:-.03em}
 .b .tel .lbl{color:rgba(255,255,255,.75)}
 .b .on{background:var(--navy);color:#fff;font-size:5.8pt;line-height:1.5;display:flex;flex-direction:column;justify-content:flex-end}
 .b .ad{background:var(--mint);color:var(--ink);font-size:5.8pt;line-height:1.5;display:flex;flex-direction:column;justify-content:flex-end}
 .b i{font-style:normal;font-size:4.6pt;font-weight:600;opacity:.65;margin-bottom:auto}
