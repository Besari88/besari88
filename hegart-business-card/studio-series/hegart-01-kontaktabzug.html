:root{--navy:#0D1B2E;--navy2:#16273F;--night:#070E1A;--cream:#FCF6EC;--ink:#2E2A26;--blue:#0589C2;--mint:#05E19F;--b:3mm}

html,body{background:#3a3a3a}

@media print{.sheet{padding:0;gap:0}html,body{background:none}}
.card{position:relative;overflow:hidden;break-after:page;width:calc(var(--W) + 2*var(--b));height:calc(var(--H) + 2*var(--b))}
.safe{position:absolute;inset:calc(var(--b) + 4mm)}

.mark{display:block;overflow:visible}
.qr svg{display:block;width:100%;height:100%}
.abs{position:absolute}

@page{size:91mm 61mm;margin:0}
.card{--W:85mm;--H:55mm}

 .b .strip{left:0;right:0;top:0;display:grid;grid-template-columns:repeat(4,1fr);gap:1.1mm}

 .b .rule{left:0;right:0;top:21mm;height:.12mm;background:rgba(252,246,236,.18)}
 .b .who{left:0;bottom:0}

 .b .who .n i{color:var(--mint)}
 .b .who .a{margin-top:1.8mm;font-size:5.5pt;line-height:1.5;opacity:.72}
 .b .ct{right:0;bottom:0;font-size:6.1pt;line-height:1.62;text-align:right}
