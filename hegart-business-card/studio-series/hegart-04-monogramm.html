<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Hegart Studio — 04-monogramm</title>
<style>
@font-face{font-family:"Fraunces";src:url(../assets/fonts/fraunces-latin-full-normal.woff2) format("woff2");font-weight:100 900;font-style:normal}
@font-face{font-family:"Fraunces";src:url(../assets/fonts/fraunces-latin-full-italic.woff2) format("woff2");font-weight:100 900;font-style:italic}
@font-face{font-family:"Work Sans";src:url(../assets/fonts/work-sans-latin-300-normal.woff2) format("woff2");font-weight:300}
@font-face{font-family:"Work Sans";src:url(../assets/fonts/work-sans-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Work Sans";src:url(../assets/fonts/work-sans-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Work Sans";src:url(../assets/fonts/work-sans-latin-600-normal.woff2) format("woff2");font-weight:600}
:root{--navy:#0D1B2E;--navy2:#16273F;--night:#070E1A;--cream:#FCF6EC;--ink:#2E2A26;--blue:#0589C2;--mint:#05E19F;--b:3mm}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#3a3a3a}
body{font-family:"Work Sans",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-kerning:normal;text-rendering:geometricPrecision}
.sheet{display:flex;flex-direction:column;gap:10mm;align-items:center;padding:10mm}
@media print{.sheet{padding:0;gap:0}html,body{background:none}}
.card{position:relative;overflow:hidden;break-after:page;width:calc(var(--W) + 2*var(--b));height:calc(var(--H) + 2*var(--b))}
.safe{position:absolute;inset:calc(var(--b) + 4mm)}
.serif{font-family:"Fraunces",serif;font-weight:600;font-variation-settings:"opsz" 144,"SOFT" 0,"WONK" 0;letter-spacing:-.01em}
.serif i,.it{font-style:italic;font-weight:500}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:4.6pt;letter-spacing:.14em;text-transform:uppercase}
.mark{display:block;overflow:visible}
.qr svg{display:block;width:100%;height:100%}
.abs{position:absolute}

@page{size:91mm 61mm;margin:0}
.card{--W:85mm;--H:55mm}

 .f{background:var(--night);color:var(--cream)}
 .f .mk{left:50%;top:50%;width:21mm;transform:translate(-50%,-54%);color:var(--cream);--bar:var(--mint)}
 .f .u{left:0;right:0;bottom:0;text-align:center;font-size:5pt;letter-spacing:.32em;text-transform:lowercase;color:rgba(252,246,236,.55)}
 .b{background:var(--cream);color:var(--ink)}
 .b .q{left:0;top:-.6mm;width:52mm;font-size:12pt;line-height:1.08;color:var(--navy);font-weight:500}
 .b .q i{color:var(--blue)}
 .b .mk{right:0;top:0;width:6mm;color:var(--navy);--bar:var(--blue)}
 .b .sig{left:0;top:13.6mm;font-size:5.4pt;color:var(--ink);opacity:.7}
 .b .cols{left:0;right:0;bottom:0;display:grid;grid-template-columns:auto auto auto;justify-content:space-between;padding-top:2.6mm;border-top:.14mm solid rgba(13,27,46,.25);font-size:5.8pt;line-height:1.55}
 .b .cols b{font-weight:600;color:var(--navy)}
</style></head><body><svg width="0" height="0" style="position:absolute"><defs><symbol id="hg" viewBox="15 11 212 193">
<g stroke="currentColor" stroke-width="12.6" stroke-linecap="square" fill="none">
<line x1="22" y1="17.5" x2="22" y2="197.5"/><line x1="112" y1="17.5" x2="112" y2="197.5"/><line x1="22" y1="107.5" x2="112" y2="107.5"/>
<line x1="112" y1="17.5" x2="220" y2="17.5"/><line x1="220" y1="40.5" x2="220" y2="197.5"/><line x1="112" y1="197.5" x2="220" y2="197.5"/>
<line style="stroke:var(--bar,currentColor)" x1="166" y1="107.5" x2="220" y2="107.5"/></g></symbol></defs></svg><div class="sheet">
<section class="card f"><div class="safe">
 <div class="abs mk"><svg class="mark " viewBox="0 0 212 193"><use href="#hg" width="212" height="193"/></svg></div>
 <div class="abs u">hegart.de</div></div></section>
<section class="card b"><div class="safe">
 <div class="abs q serif it">Wir gestalten Momente und Marken, die <i>bleiben.</i></div>
 <div class="abs mk"><svg class="mark " viewBox="0 0 212 193"><use href="#hg" width="212" height="193"/></svg></div>
 <div class="abs sig">Hegart Studio — Fotografie, Grafikdesign, Marketing &amp; Events</div>
 <div class="abs cols">

  <div>info@hegart.de<br>hegart.de</div>

 </div></div></section>
</div></body></html>
