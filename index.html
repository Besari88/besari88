async function boot(){
  const p=new URLSearchParams(location.search);
  if(p.get('embed')==='1'){S.embed=true;document.getElementById('site').classList.add('embed');}
  const lg=p.get('lang');
  if(lg==='de'||lg==='en')S.lang=lg;
  else{const sv=await gt('ui-lang',false);if(sv==='de'||sv==='en')S.lang=sv;}

  // Load configuration up front. This must happen BEFORE any early return below
  // (admin login, placement test, confirmation page) so that every entry path
  // has courses/exams/fields available.
  S.fields=await gt('cfg-f3',true)||JSON.parse(JSON.stringify(SEED_F));
  // Migrim: fushat e reja të shtuara në kod (p.sh. ato të Sprachreisen) nuk
  // ekzistojnë te instalimet që kanë tashmë një cfg-f3 të ruajtur. Prandaj
  // shtohen këtu sipas id-së, pa prekur renditjen apo ndryshimet e adminit.
  (function migrateFields(){
    if(!Array.isArray(S.fields))return;
    const have=new Set(S.fields.map(f=>f&&f.id));
    const missing=SEED_F.filter(f=>f&&f.id&&!have.has(f.id));
    if(missing.length){
      S.fields=S.fields.concat(JSON.parse(JSON.stringify(missing)));
      _fieldsMigrated=true;
    }
  })();
  S.courses=await gt('cfg-c3',true)||JSON.parse(JSON.stringify(SEED_C));
  S.exams=await gt('cfg-e2',true)||JSON.parse(JSON.stringify(SEED_E));
  S.ffCats=await gt('cfg-ffcats',true)||[];
  S.rolePerms=await gt('cfg-roles',true)||null;
  S.bestpl=await gt('cfg-bestpl',true)||null;
  S.bestbooks=await gt('cfg-bestbooks',true)||null;
  const _d=await gt('cfg-disc',true); S.disc=(_d===null||_d===undefined)?PREM_DISC:_d;
  const _rt=await gt('cfg-rate',true); S.rate=(_rt===null||_rt===undefined)?RATE:_rt;
  const _hp=await gt('cfg-hpk',true); S.hpk=(_hp&&_hp.length)?_hp:SEED_H.slice();
  const _rz=await gt('cfg-reise',true); S.reise=(_rz&&typeof _rz==='object')?_rz:null;
  const _ld=await gt('cfg-lvdesc',true); S.lvdesc=(_ld&&typeof _ld==='object')?_ld:null;
  if(!await gt('cfg-f3',true))await pt('cfg-f3',S.fields,true);
  else if(_fieldsMigrated)await pt('cfg-f3',S.fields,true);
  if(!await gt('cfg-c3',true))await pt('cfg-c3',S.courses,true);

  // --- Access control ---------------------------------------------------
  // The app is not public. Students only ever reach it through a direct link
  // (a course/exam/prep booking link or the placement test). Everything else
  // is admin-only and reachable via ?login. Anyone landing on the bare URL is
  // sent to the public website.
  const DEEP_PARAMS=['einstufung','einstufungstest','abend','course','intensiv','einzel','individual',
    'telc','prep','sprachen','weitere','reise','sprachreisen','cat','bestaetigung','confirm'];
  const hasDeepLink=DEEP_PARAMS.some(k=>p.has(k));
  const wantsLogin=p.has('login')||p.has('admin');
  S.adminMode=wantsLogin||!!_pbToken;
  if(!S.adminMode){document.getElementById('site').classList.add('embed');}
  if(!hasDeepLink&&!wantsLogin&&!_pbToken){location.replace('https://lingowelt.de');return;}

  // Direct link to the placement test: ?einstufung (optionally ?einstufung=a1|a2|b1|b2)
  if(p.has('einstufung')||p.has('einstufungstest')){
    const lv=(p.get('einstufung')||p.get('einstufungstest')||'').toLowerCase();
    EST.lvKey=null;estResetQuiz();
    if(LEVELS[lv]){EST.lvKey=lv;EST.screen='contact';}
    else{EST.screen='levels';}
    S.view='est';render();return;
  }

  // Admin entry: ?login -> admin panel (if a session exists) or the login screen.
  if(wantsLogin){
    if(_pbToken){S.admin=true;S.view='a-b';}
    else{S.view='a-log';}
    render();return;
  }

  // Public confirmation page (opened via QR). Handled early — no login needed.
  const bestId=p.get('bestaetigung')||p.get('confirm');
  if(bestId){S.view='best';render();loadPublicBest(bestId);return;}

  // Deep links. ?course=b1 -> evening (legacy). ?abend=b1 / ?intensiv=b1 explicit.
  const ab=p.get('abend')||p.get('course'),iv=p.get('intensiv'),tl=p.get('telc'),pr=p.get('prep'),ct=p.get('cat');
  const ez=p.get('einzel')||p.get('individual'),lang2=p.has('sprachen')||p.has('weitere'),reise=p.has('reise')||p.has('sprachreisen');
  const langCode=(p.get('sprachen')||p.get('weitere')||'').toLowerCase();
  const reiseCode=(p.get('reise')||p.get('sprachreisen')||'').toLowerCase();
  const fmt=p.get('format')==='single'?'single':'group';
  if(ab){const v=ab.toUpperCase();const has=['A1','A2','B1','B2','C1','C2'].includes(v);
    S.b=blankB('abend',has?{lv:v,fmt}:{fmt});S.view=has?'pick':'levels';}
  else if(iv){const v=iv.toUpperCase();const has=['A1','A2','B1','B2','C1','C2'].includes(v);
    S.b=blankB('intensiv',has?{lv:v,fmt}:{fmt});S.view=has?'pick':'levels';}
  else if(tl){S.b=blankB('telc',{lv:tl.toUpperCase()});S.view='pick';}
  else if(pr){S.b=blankB('vorb',{prep:pr.toUpperCase()});S.view='pick';}
  else if(ez){const v=ez.toUpperCase();const has=['A1','A2','B1','B2','C1','C2'].includes(v);
    S.b=blankB('intensiv',has?{lv:v,fmt:'single'}:{fmt:'single'});S.view=has?'pick':'levels';}
  else if(lang2){
    // ?sprachen=en hap direkt atë gjuhë; ?sprachen ose ?sprachen=all hap listën.
    const hit=LANGS_OFFERED.find(x=>x.v===langCode);
    if(hit){S.b=blankB('sprachen',{slang:hit.v});S.view='pick';}
    else{S.b=blankB('sprachen');S.view='langs';}
  }
  else if(reise){
    // ?reise=standard hap direkt atë paketë; ?reise ose ?reise=all hap listën.
    const hit=reiseCfg().packages.find(x=>x.id===reiseCode);
    if(hit){openReise(hit.id);return;}
    S.b=blankB('reise');S.view='reise';
  }
  else if(ct&&CATS.some(c=>c.id===ct)){S.b=blankB(ct);S.view='pick';}
  render();
}
const nid=()=>'LW-'+Math.random().toString(36).slice(2,8).toUpperCase();

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fd(iso,full){if(!iso)return '';const d=new Date(iso+'T00:00:00');if(isNaN(d))return iso;
  const m=(full?MONF:MON)[S.lang]||MON.de;return S.lang==='de'?`${d.getDate()}. ${m[d.getMonth()]} ${d.getFullYear()}`:`${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;}
const fdw=iso=>iso?(DOW[S.lang]||DOW.de)[new Date(iso+'T00:00:00').getDay()]:'';
const dun=iso=>Math.ceil((new Date(iso+'T00:00:00')-new Date())/864e5);
const isStale=iso=>!!iso&&dun(iso)<-30;
/* Booking windows differ by product:
   - telc exams: open until the day before the exam (last open day = 2 days before);
     seats-full is handled separately via seatState.
   - courses (abend / intensiv / individual): open until 2 weeks AFTER the start,
     as long as seats remain — a late start-of-course join is allowed. */
const isOpenExam=o=>dun(o.date||o.start)>=2;
const isOpenCourse=o=>dun(o.start||o.date)>=-14;
/* Back-compat helper (exam-style) for callers that don't pass a kind. */
const isOpen=o=>isOpenExam(o);

/* ---- Cancellation window: up to 1 calendar month before the start ---- */
// The date a booking is measured against: course start, or exam date.
function refDate(r){
  if(!r)return null;
  if(r.snap)return r.snap.start||r.snap.date||null;
  return null;
}
// One calendar month before X. setMonth() alone overflows (Mar 31 -> "Feb 31" -> Mar 3),
// which would wrongly EXTEND the window, so clamp to the last valid day of that month.
function cutoff(iso){
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d))return null;
  const day=d.getDate();
  const c=new Date(d.getFullYear(),d.getMonth()-1,1);
  const lastDay=new Date(c.getFullYear(),c.getMonth()+1,0).getDate();
  c.setDate(Math.min(day,lastDay));
  return c;
}
// Days remaining until the cancellation deadline.
function cancelDaysLeft(r){
  const ref=refDate(r);
  if(!ref)return null;              // individual tuition: no fixed start
  const c=cutoff(ref);
  if(!c)return null;
  return Math.ceil((c-new Date())/864e5);
}
function canCancel(r){
  if(!r||r.status==='cancelled')return false;
  const ref=refDate(r);
  if(!ref)return true;              // no fixed date -> always cancellable
  const left=cancelDaysLeft(r);
  return left!==null&&left>0;
}

/* Totali i një Sprachreise: (kursi + sigurimi) × javë + transferi. */
function reiseTotal(){
  const cfg=reiseCfg(), b=S.b;
  const pk=reisePkg(b.rpkg);
  if(!pk||!b.rweeks)return null;
  const perWeek = (pk.id==='individuell')
    ? (b.rue?b.rue*cfg.indivPerUE:null)

  if(perWeek==null)return null;
  let sum = perWeek*b.rweeks;
  if(b.rins) sum += cfg.insurancePerWeek*b.rweeks;
  if(b.rair){
    const ap=cfg.airports.find(a=>a.id===b.rair);
    if(ap) sum += Number(ap.price)||0;
  }
  return sum;
}

function seatState(o){
  if(o.seats===null||o.seats===undefined) return {c:'free',t:t('free')};

  if(o.seats<=3) return {c:'few',t:`${o.seats} ${t('free')}`};
  return {c:'free',t:t('free')};
}
const catOf=()=>CATS.find(x=>x.id===S.b.cat)||CATS[0];
/* Levels that actually have an active cohort for this course type */
function myLevels(){
  const ct=catOf().ctype;
  const s=new Set(S.courses.filter(c=>c.active&&(c.ct||'abend')===ct).map(c=>c.level));
  return ['A1','A2','B1','B2','C1','C2'].filter(l=>s.has(l));
}
/* Cohorts for the chosen type + level. Level is required, so we never
   silently show only A1 just because it sorts first. */
/* Përzgjedh ofertat që i shfaqen nxënësit.
   Renditja mbetet gjithmonë kronologjike. Nëse ka të paktën MIN_OPEN data
   ende të rezervueshme, ato të mbyllurat hiqen fare — përndryshe lista
   plotësohet me të mbyllurat më të fundit, që të mos duket bosh. */
function pickOffers(list, dateOf, openFn){
  const MIN_OPEN=3;
  const key=o=>String(dateOf(o)||'');
  const open=list.filter(openFn);
  if(open.length>=MIN_OPEN){
    return open.sort((a,b)=>key(a).localeCompare(key(b)));
  }
  // plotëso me të mbyllurat më të fundit deri në MIN_OPEN gjithsej
  const closed=list.filter(o=>!openFn(o))
    .sort((a,b)=>key(b).localeCompare(key(a)))
    .slice(0,Math.max(0,MIN_OPEN-open.length));
  return open.concat(closed).sort((a,b)=>key(a).localeCompare(key(b)));
}
function myCourses(){
  const ct=catOf().ctype;
  if(!S.b.lv)return [];
  const l=S.courses.filter(c=>c.active&&(c.ct||'abend')===ct&&c.level===S.b.lv);
  return pickOffers(l,c=>c.start,isOpenCourse);
}
function myExams(){
  let l=S.exams.filter(e=>e.active!==false);
  if(S.b.lv)l=l.filter(e=>e.level===S.b.lv);
  return pickOffers(l,e=>e.date,isOpenExam);
}

  if(c.kind==='course')return S.courses.find(x=>x.id===S.b.offer);
  if(c.kind==='exam')return S.exams.find(x=>x.id===S.b.offer);
  return null;};

/* Price is always broken into base + registration fee.
   Paying in full waives the registration fee entirely. */
function baseFee(){
  const c=catOf(),o=curOffer();
  if(c.id==='reise')return reiseTotal();
  if(c.kind==='course'){
    if(S.b.fmt==='single')return S.b.hrs?S.b.hrs*S.rate:null;
    return o?o.price:null;
  }
  if(c.kind==='exam'&&o)return o.fee||FEES[o.level]||0;
  return null;
}
function regFee(){
  const c=catOf(),o=curOffer();
  if(c.kind!=='course')return 0;              // exams have no registration fee
  if(S.b.fmt==='single')return 0;             // individual tuition: none
  if(S.b.pay==='full')return 0;               // waived when paying in full
  return o?o.reg:0;
}
function price(){
  const b=baseFee();
  if(b===null)return null;
  return b+regFee();
}
/* What the instalment plan looks like: 3× for most, 4× for the longer levels. */
function instalments(){
  const o=curOffer();
  const b=baseFee();
  if(b===null)return null;
  const n=(o&&o.weeks>=14)?4:3;
  return {n,amt:Math.round(b/n)};
}

  if(c.kind==='course'){

    // Intensiv group courses must answer the visa question before proceeding.

    if(needVisaAnswer&&!S.b.visa)return false;
    return !!(S.b.lv&&S.b.mode&&S.b.offer&&S.b.pay);

  if(c.kind==='prep')return !!(S.b.prep&&S.b.mode);
  if(c.kind==='lang')return !!(S.b.slang&&S.b.lv&&S.b.mode);
  if(c.id==='reise'){

    if(S.b.rpkg==='individuell'&&!S.b.rue)return false;
    return true;
  }

function fIn(f,v){
  const lb=L(f.label),rq=f.required?'<span class="rq">*</span>':'';
  const id='y_'+f.id;
  if(['text','email','email2','tel'].includes(f.type)){
    const ty=f.type==='email2'?'email':f.type;
    return `<div class="f"><label>${esc(lb)} ${rq}</label><input type="${ty}" id="${id}" value="${esc(v||'')}"></div>`;
  }
  if(f.type==='textarea')return `<div class="f"><label>${esc(lb)} ${rq}</label><textarea id="${id}">${esc(v||'')}</textarea></div>`;
  if(f.type==='select')return `<div class="f"><label>${esc(lb)} ${rq}</label><select id="${id}">
    <option value="">${esc(t('choose'))}</option>
    ${(f.options||[]).map(o=>`<option value="${esc(ov(o))}" ${v===ov(o)?'selected':''}>${esc(ol(o))}</option>`).join('')}</select></div>`;
  if(f.type==='radio'){
    // The visa card already carries this title as its heading — don't repeat it.
    const dupe=f.id==='visum';
    return `<div class="f">${dupe?'':`<label>${esc(lb)} ${rq}</label>`}
      ${(f.options||[]).map(o=>`<label class="opt"><input type="radio" name="${id}" value="${esc(ov(o))}" ${v===ov(o)?'checked':''}><span>${esc(ol(o))}</span></label>`).join('')}</div>`;
  }
  if(f.type==='checkbox'){
    const lk=f.link&&f.link.url?` <a class="lk" href="${esc(f.link.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(L(f.link.label)||'Info')}</a>`:'';
    return `<div class="f"><label class="opt"><input type="checkbox" id="${id}" ${v?'checked':''}><span>${esc(lb)} ${rq}${lk}</span></label></div>`;
  }
  if(f.type==='date3'){
    const d=v||{},yN=new Date().getFullYear();
    const dd=Array.from({length:31},(_,i)=>i+1),yy=Array.from({length:92},(_,i)=>yN-4-i),mm=MONF[S.lang]||MONF.de;
    return `<div class="f"><label>${esc(lb)} ${rq}</label><div class="d3">
      <select id="${id}_d"><option value="">${esc(t('day'))}</option>${dd.map(x=>`<option value="${x}" ${d.d==x?'selected':''}>${x}</option>`).join('')}</select>
      <select id="${id}_m"><option value="">${esc(t('mon'))}</option>${mm.map((x,i)=>`<option value="${i+1}" ${d.m==(i+1)?'selected':''}>${x}</option>`).join('')}</select>
      <select id="${id}_y"><option value="">${esc(t('yr'))}</option>${yy.map(x=>`<option value="${x}" ${d.y==x?'selected':''}>${x}</option>`).join('')}</select>
    </div></div>`;
  }
  return '';
}

/* Fields can be limited to certain categories (e.g. visa status is only
   relevant for the intensive course, which is what student visas are for). */
function fieldApplies(f,cat){
  // The visa question is now asked earlier (in the pick step), so never show it
  // as a form field — it would be a duplicate question.
  if(f.id==='visum')return false;
  if(!f.only||!f.only.length)return true;
  return f.only.includes(cat||S.b.cat);
}
const liveFields=cat=>S.fields.filter(f=>fieldApplies(f,cat));

function collect(){
  const v={},miss=[];
  // Only walk fields that are actually on screen for this category; a hidden
  // field has no DOM node and must not be validated.
  for(const f of liveFields()){
    const id='y_'+f.id;
    if(f.type==='date3'){
      const d=document.getElementById(id+'_d').value,m=document.getElementById(id+'_m').value,y=document.getElementById(id+'_y').value;
      if(f.required&&(!d||!m||!y))miss.push(L(f.label));
      v[f.id]={d,m,y};
    }else if(f.type==='radio'){
      const e=document.querySelector(`input[name="${id}"]:checked`);
      if(f.required&&!e)miss.push(L(f.label));
      v[f.id]=e?e.value:'';
    }else if(f.type==='checkbox'){
      const e=document.getElementById(id);
      if(f.required&&!e.checked)miss.push(L(f.label));
      v[f.id]=e.checked;
    }else{
      const e=document.getElementById(id);
      if(f.required&&!e.value.trim())miss.push(L(f.label));
      v[f.id]=e.value.trim();
    }
  }
  return {v,miss};
}
/* ══════════ Konfirmimi para dërgimit (§ 312j BGB) ══════════
   Shfaq një dialog me përmbledhjen dhe tekstin e detyrueshëm.
   Kthen Promise<boolean>: true = vazhdo, false = anulo. */
function confirmBinding(){
  return new Promise(res=>{
    const c=CATS.find(x=>x.id===S.b.cat),o=curOffer();
    const isExam=c&&c.kind==='exam';
    const total=price();
    // Rreshtat e përmbledhjes

    if(c)rows.push([t('offer'),L(c.label)]);
    if(S.b.lv)rows.push([t('level'),S.b.lv]);
    if(o)rows.push([t('cWhen'),isExam?`${fdw(o.date)}, ${fd(o.date,true)}`:`${fd(o.start)} — ${fd(o.end)}`]);
    if(o&&!isExam&&o.time)rows.push([t('time'),`${L(courseDays(o,S.b.cat))} · ${o.time}`]);
    if(total!=null)rows.push([t('total'),eur(total)]);
    const html=`<div class="ovl" id="cbOvl">
      <div class="mdl" style="max-width:460px">
        <h3 style="margin-bottom:10px">${esc(t('cbTitle'))}</h3>
        <div class="sum" style="margin-bottom:12px">
          ${rows.map(r=>`<div class="r"><span class="k">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join('')}
        </div>
        <div style="background:var(--am-w);border:1px solid #f0dcae;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.55;color:var(--am)">

        </div>
        <div style="display:flex;gap:8px">
          <button class="btn bs" style="flex:1" id="cbNo">${esc(t('cbCancel'))}</button>
          <button class="btn bp" style="flex:1.3" id="cbYes">${esc(t('cbOk'))}</button>
        </div>
      </div></div>`;
    // Te faqja publike s'ka #mh — krijoje sipas nevojës.
    let host=document.getElementById('mh');
    if(!host){host=document.createElement('div');host.id='mh';document.body.appendChild(host);}
    host.innerHTML=html;
    const done=v=>{host.innerHTML='';res(v);};
    document.getElementById('cbYes').onclick=()=>done(true);
    document.getElementById('cbNo').onclick=()=>done(false);
    document.getElementById('cbOvl').onclick=e=>{if(e.target.id==='cbOvl')done(false);};
  });
}

/* Maskon numrin e rezervimit: LW-VJIHIW → LW-••••IW
   Përdoret kur klienti ka kërkuar vetëm me email. */
function maskBookId(id){
  const s=String(id||'');
  const m=s.match(/^(LW-)(.+)$/);
  if(!m)return s.length>2?('••••'+s.slice(-2)):'••••';
  const body=m[2];
  if(body.length<=2)return m[1]+'••';
  return m[1]+'•'.repeat(Math.max(2,body.length-2))+body.slice(-2);
}

    if(_pbCreated[k]&&!v._created)v._created=_pbCreated[k];
    out.push(v);
  }}catch(e){}}
  // Sort by real creation time (newest first); fall back to 'at' when missing.
  out.sort((a,b)=>{
    const ca=a._created||a.at||'', cb=b._created||b.at||'';
    return cb.localeCompare(ca);
  });
  return out;
}

function csvCell(v){v=(v==null?'':String(v));return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function downloadCSV(filename,rows){
  // rows: array of arrays. Prepend BOM so Excel opens UTF-8 correctly. Use ; for DE Excel.
  const sep=';';
  const body=rows.map(r=>r.map(csvCell).join(sep)).join('\r\n');
  const blob=new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
}
function bookingsToCSV(list,filename){
  // Kolonat e Sprachreisen shtohen vetëm kur lista përmban udhëtime.
  const hasReise=list.some(r=>r.cat==='reise');
  const head=['ID','Name','Telefon','E-Mail','Kategorie','Niveau','Stunden','Visum benötigt','Status','Angemeldet am'];
  if(hasReise)head.push('Programm','Wochen','UE/Woche','Versicherung','Transfer','Preis');
  const stMap={confirmed:'bestätigt',pending:'ausstehend',cancelled:'storniert'};
  // Excel turns long numbers into scientific notation. Wrap phone as ="..." so it
  // is treated as text and shown exactly as entered.
  const asText=v=>{v=(v==null?'':String(v)).trim();return v?`="${v.replace(/"/g,'')}"`:'';};
  const cfgR=hasReise?reiseCfg():null;
  const airName=id=>{if(!cfgR||!id)return '';const a=cfgR.airports.find(x=>x.id===id);return a?a.name:'';};
  const rows=[head];
  list.forEach(r=>{
    const row=[r.id,nmOf(r),asText(phOf(r)),emOf(r),(r.cat||(r.fmt==='single'?'individual':'')||''),lvOf(r),
      (r.fmt==='single'&&r.hrs?r.hrs:''),
      (needsVisa(r)?'Ja':'Nein'),
      (stMap[r.status]||r.status||'ausstehend'),(r.at?r.at.slice(0,10):'')];
    if(hasReise){
      const pk=r.cat==='reise'?reisePkg(r.rpkg):null;
      row.push(pk?L(pk.label):(r.rpkg||''),
        (r.rweeks!=null?r.rweeks:''),

        (r.cat==='reise'?(r.rins?'Ja':'Nein'):''),
        airName(r.rair),
        (r.cat==='reise'&&r.price!=null?r.price:''));
    }

  });

}
function matchFilt(r,f){
  if(f.cat==='__indiv__'){if(r.fmt!=='single')return false;}
  else if(f.cat==='__visa__'){if(!needsVisa(r))return false;}
  else if(f.cat&&r.cat!==f.cat)return false;
  if(f.st&&r.status!==f.st)return false;
  if(f.lv&&r.lv!==f.lv)return false;
  if(f.df&&(!r.at||r.at.slice(0,10)<f.df))return false;
  if(f.dt&&(!r.at||r.at.slice(0,10)>f.dt))return false;
  if(f.q&&!((nmOf(r)+' '+emOf(r)+' '+r.id).toLowerCase().includes(f.q.toLowerCase())))return false;
  if(f.pay){const ps=payState(r);if(f.pay==='full'){if(ps!=='full'&&ps!=='over')return false;}else if(ps!==f.pay)return false;}
  return true;
}

/* ══════════ ZHVENDOSJA E NXËNËSIT NË KURS TJETËR ══════════
   Lejohet vetëm brenda së njëjtës kategori (kurs→kurs, telc→telc).
   Ruhet gjurmë te r.moves[] dhe çmimi vendoset nga përdoruesi. */
function moveCands(r){
  const c=CATS.find(x=>x.id===r.cat);
  if(!c)return [];
  if(c.kind==='exam')
    return (S.exams||[]).filter(e=>e.active!==false&&(!r.snap||e.id!==r.snap.id))
      .slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  // kurse: vetëm ato të së njëjtës kategori (abend/intensiv)
  return (S.courses||[]).filter(o=>o.active!==false&&o.ct===r.cat&&(!r.snap||o.id!==r.snap.id))
    .slice().sort((a,b)=>String(a.start).localeCompare(String(b.start)));
}
function moveOptLabel(r,o){
  const c=CATS.find(x=>x.id===r.cat);
  if(c&&c.kind==='exam')return `${o.level} · ${fd(o.date,true)} · ${eur(o.fee)}`;
  return `${o.level} · ${fd(o.start)} — ${fd(o.end)} · ${o.time||''} · ${eur(o.price)}`;
}
function moveBlock(r){
  const cands=moveCands(r);
  if(!cands.length)return '';
  const hist=(Array.isArray(r.moves)?r.moves:[]);
  return `<div style="margin:4px 0 10px">
    <div style="font-weight:800;font-size:13px;margin-bottom:7px">${esc(t('mvTitle'))}</div>
    ${hist.length?`<div style="font-size:11.5px;color:var(--i3);margin-bottom:7px">
      ${hist.map(h=>`<div>↪ ${esc(h.at?h.at.slice(0,10):'')}: ${esc(h.from||'?')} → ${esc(h.to||'?')}</div>`).join('')}
    </div>`:''}
    <div style="display:grid;grid-template-columns:1fr auto;gap:6px">
      <select id="mvSel" style="padding:8px 9px;border:1px solid var(--ln);border-radius:8px;font-size:12.5px;font-family:inherit;background:#fff;width:100%">
        <option value="">${esc(t('mvPick'))}</option>
        ${cands.map(o=>`<option value="${esc(o.id)}">${esc(moveOptLabel(r,o))}</option>`).join('')}
      </select>
      <button class="btn bp bsm" onclick="moveDo('${r.id}')">${esc(t('mvBtn'))}</button>
    </div>
  </div>`;
}
async function moveDo(id){
  const r=S.cache.find(x=>x.id===id);if(!r)return;
  const sel=document.getElementById('mvSel');if(!sel||!sel.value){alert(t('mvPick'));return;}
  const cands=moveCands(r);
  const o=cands.find(x=>String(x.id)===String(sel.value));if(!o)return;
  const c=CATS.find(x=>x.id===r.cat);
  const isExam=c&&c.kind==='exam';
  const newPrice=isExam?(o.fee!=null?o.fee:r.price):(o.price!=null?o.price:r.price);
  const oldPrice=r.price;
  // Përshkrimi i vjetër/ri për gjurmë
  const fromLbl=r.snap?(isExam?`${r.snap.level} ${r.snap.date}`:`${r.snap.level} ${r.snap.start}`):'—';
  const toLbl=isExam?`${o.level} ${o.date}`:`${o.level} ${o.start}`;
  if(!confirm(t('mvConfirm').replace('{a}',fromLbl).replace('{b}',toLbl)))return;
  // Çmimi: pyet vetëm nëse ndryshon
  let usePrice=oldPrice;
  if(newPrice!=null&&oldPrice!=null&&Number(newPrice)!==Number(oldPrice)){
    usePrice=confirm(t('mvPrice').replace('{a}',eur(oldPrice)).replace('{b}',eur(newPrice)))?newPrice:oldPrice;
  } else if(oldPrice==null){usePrice=newPrice;}
  // Zbato
  r.snap=JSON.parse(JSON.stringify(o));
  r.lv=o.level||r.lv;
  r.price=usePrice;
  if(isExam&&o.fee!=null)r.base=usePrice;
  if(!isExam&&o.price!=null)r.base=usePrice;
  if(!Array.isArray(r.moves))r.moves=[];
  r.moves.push({at:new Date().toISOString(),from:fromLbl,to:toLbl,by:_pbEmail||''});
  if(await payPersist(r)){det(id);reB();}
}

/* Ruaj ndryshimet te rezervimi dhe rifresko pamjet. */
async function payPersist(r){
  // Ruaj edhe email-in te fusha e regjistrit, si te krijimi i rezervimit,
  // që rregullat e PocketBase (email = @request.query.e) të vazhdojnë të vlejnë.
  let em=(emOf(r)||'').toLowerCase().trim();
  if(em==='—'||!em.includes('@'))em='';
  let ok=false;
  try{ ok=await pt('bk:'+r.id,r,true,em?{email:em}:null); }catch(e){ ok=false; }
  if(!ok){
    alert((S.lang==='en'?'Saving failed. Check your login / connection.'
                        :'Speichern fehlgeschlagen. Login / Verbindung prüfen.'));
    return false;
  }
  const i=S.cache.findIndex(x=>x.id===r.id);
  if(i>=0)S.cache[i]=r;
  return true;
}
async function payAdd(id){
  const r=S.cache.find(x=>x.id===id);
  if(!r){alert('Buchung nicht gefunden: '+id);return;}
  const eD=document.getElementById('pD'),eA=document.getElementById('pA'),
        eM=document.getElementById('pM'),eR=document.getElementById('pR');
  if(!eA){alert('Formular nicht bereit.');return;}
  let d=(eD&&eD.value)||'';
  if(!d)d=new Date().toISOString().slice(0,10); // fallback nëse data është bosh
  const raw=String((eA.value!=null?eA.value:'')).replace(',','.').trim();
  const a=parseFloat(raw);
  if(!raw||!isFinite(a)||a===0){alert(t('payAmt'));if(eA)eA.focus();return;}
  const m=(eM&&eM.value)||'transfer';
  const ref=((eR&&eR.value)||'').trim();
  if(!Array.isArray(r.pays))r.pays=[];
  r.pays.push({d,a:Math.round(a*100)/100,m,ref});
  payReadMeta(r);
  const ok=await payPersist(r);
  if(ok){det(id);reB();}
  else{r.pays.pop();} // rikthe gjendjen nëse ruajtja dështoi
}
async function payDel(id,idx){
  const r=S.cache.find(x=>x.id===id);if(!r||!Array.isArray(r.pays))return;
  if(!confirm(t('payDel')))return;
  r.pays.splice(idx,1);
  payReadMeta(r);
  if(await payPersist(r)){det(id);reB();}
}
/* Lexo shumën e pritur + numrin e faturës nga formulari (nëse është hapur). */
function payReadMeta(r){
  const du=document.getElementById('pDue'),rn=document.getElementById('pRnr');
  if(du){const v=du.value.trim();r.due=v===''?null:(parseFloat(v)||0);}
  if(rn){const v=rn.value.trim();r.rnr=v||'';}
}
async function paySaveMeta(id){
  const r=S.cache.find(x=>x.id===id);if(!r)return;
  payReadMeta(r);
  if(await payPersist(r)){det(id);reB();}
}

/* Lexon formularin te një objekt përshkrimi. */
function lvdRead(){
  const v=id=>{const e=document.getElementById(id);return e?e.value:'';};
  const cur=lvdCur();
  const items=[];
  for(let i=0;i<cur.items.length;i++){
    const td=v('lvd_t_de_'+i), te=v('lvd_t_en_'+i), xd=v('lvd_x_de_'+i), xe=v('lvd_x_en_'+i);
    if(!td&&!te&&!xd&&!xe)continue;
    items.push({title:{de:td,en:te||td},text:{de:xd,en:xe||xd}});
  }
  return {intro:{de:v('lvd_i_de'),en:v('lvd_i_en')||v('lvd_i_de')},
          items,
          outro:{de:v('lvd_o_de'),en:v('lvd_o_en')||v('lvd_o_de')}};
}
function lvdStore(){
  if(!S.lvdesc||typeof S.lvdesc!=='object')S.lvdesc=JSON.parse(JSON.stringify(SEED_LVD));
  return S.lvdesc;
}
function lvdAddItem(){
  const st=lvdStore(), k=S.lvdEdit||LVD_LEVELS[0];
  st[k]=lvdRead();
  st[k].items.push({title:{de:'',en:''},text:{de:'',en:''}});
  render();
}

async function saveReise(){
  const cfg=reiseCfg();
  const num=id=>{const e=document.getElementById(id);if(!e)return null;const v=e.value.trim();return v===''?null:(Number(v)||0);};
  const packages=cfg.packages.map(p=>{
    if(p.id==='individuell')return p;
    const price=num('rz_'+p.id), ue=num('rzue_'+p.id);
    return Object.assign({},p,{price:price!=null?price:p.price, ue:ue!=null?ue:p.ue});
  });
  const airports=cfg.airports.map((a,i)=>{
    const n=document.getElementById('rzan_'+i), pr=document.getElementById('rzap_'+i);
    return {id:a.id, name:n?n.value.trim():a.name, price:pr?(Number(pr.value)||0):a.price};
  }).filter(a=>a.name);
  const out={
    packages, airports,
    indivPerUE: num('rz_indiv')!=null?num('rz_indiv'):cfg.indivPerUE,
    insurancePerWeek: num('rz_ins')!=null?num('rz_ins'):cfg.insurancePerWeek,
    minWeeks: num('rz_minw')!=null?num('rz_minw'):cfg.minWeeks,
    ueChoices: cfg.ueChoices
  };
  S.reise=out;
  await pt('cfg-reise',out,true);
  render();
}

/* Course tabs for the form editor: '' = all courses (shared fields),
   or a category id whose specific fields are edited. Custom categories
   the admin adds live in S.ffCats (persisted). */
function ffCatList(){
  const base=CATS.map(c=>({id:c.id,label:c.label}));
  const custom=(S.ffCats||[]).map(c=>({id:c.id,label:c.label}));
  return base.concat(custom);
}
/* Which fields show under the selected tab. '' shows shared fields
   (no .only). A category shows shared + fields limited to it. */
function ffFields(cat){
  return S.fields.filter(f=>{
    const only=f.only&&f.only.length?f.only:null;
    if(!cat)return !only;                 // "all courses" = shared only
    if(!only)return true;                 // shared fields apply everywhere
    return only.includes(cat);            // course-specific
  });
}

async function mvF(i,d){const j=i+d;if(j<0||j>=S.fields.length)return;
  [S.fields[i],S.fields[j]]=[S.fields[j],S.fields[i]];await pt('cfg-f3',S.fields,true);render();}
/* All category ids the Form Fields admin knows about (built-in + custom). */
const allFFCatIds=()=>ffCatList().map(c=>c.id);
/* A field edited/deleted while a specific course/exam tab is open must only
   affect that tab. If the field is shared (or shared with other categories
   too), split it in place: the original keeps every OTHER category it
   applied to, and a scoped clone (only:[cat]) is returned for `cat` alone.
   Already-exclusive fields (only:[cat]) are returned unchanged. */
function scopeFieldToCat(f,cat){
  if(f.only&&f.only.length===1&&f.only[0]===cat)return f;
  const cur=(f.only&&f.only.length)?f.only.slice():allFFCatIds();
  f.only=cur.filter(c=>c!==cat);
  const clone=JSON.parse(JSON.stringify(f));
  clone.id=uid('f');clone.only=[cat];
  return clone;
}
async function dlF(id){if(!(await confirmModal(t('delFQ'))))return;
  const f=S.fields.find(x=>x.id===id),cat=S.ffCat||'';
  if(cat&&f&&!(f.only&&f.only.length===1&&f.only[0]===cat)){
    const cur=(f.only&&f.only.length)?f.only.slice():allFFCatIds();
    f.only=cur.filter(c=>c!==cat);           // remove from this tab only
  }else{
    S.fields=S.fields.filter(x=>x.id!==id);   // exclusive to this tab (or global tab) — delete for real
  }
  await pt('cfg-f3',S.fields,true);
  if(f)logAct('field',{de:L(f.label),en:L(f.label)},null,{act:'del',sub:f.label});
  render();}

/* Etiketa e një fushe në një gjuhë të caktuar. Fushat e vjetra ruajnë një
   string të vetëm — atëherë ai vlen për të dyja gjuhët. */
function lbOf(label,lang){
  if(label==null)return '';
  if(typeof label==='string')return lang==='de'?label:'';
  return label[lang]||'';
}
/* Rreshti i një opsioni te editori: "DE | EN", ose vetëm DE nëse s'ka përkthim. */
function optLine(o){
  if(o==null)return '';
  if(typeof o==='string')return o;
  const de=(o.label&&o.label.de)||o.value||'';
  const en=(o.label&&o.label.en)||'';
  return (en&&en!==de)?(de+' | '+en):de;
}
/* Nga "DE | EN" te objekti dygjuhësh. */
function parseOptLine(line,fallbackVal){
  const parts=String(line).split('|').map(x=>x.trim());
  const de=parts[0]||'';
  const en=parts[1]||de;
  return {value:fallbackVal||de,label:{de,en}};
}

async function svF(id){
  const lbDe=document.getElementById('f_l').value.trim(),
        lbEnRaw=(document.getElementById('f_l_en')||{}).value||'',
        ty=document.getElementById('f_t').value,
        sc=document.getElementById('f_s').value,rq=document.getElementById('f_r').checked;
  if(!lbDe){alert(t('needLbl'));return;}
  const lbEn=lbEnRaw.trim()||lbDe;     // pa përkthim → përdoret gjermanishtja
  const lb={de:lbDe,en:lbEn};
  let op;
  if(ty==='select'||ty==='radio'){
    const lines=document.getElementById('f_o').value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!lines.length){alert(t('needOpt'));return;}
    op=lines.map(x=>parseOptLine(x));
  }
  const cat=S.ffCat||'';
  if(id){
    let f=S.fields.find(x=>x.id===id);
    if(cat){
      const i=S.fields.indexOf(f),scoped=scopeFieldToCat(f,cat);
      if(scoped!==f){S.fields.splice(i+1,0,scoped);f=scoped;}
    }
    f.label=lb;f.type=ty;f.sec=sc;f.required=rq;
    if(op)f.options=op;else delete f.options;
  }
  else{const n={id:uid('f'),label:lb,type:ty,sec:sc,required:rq,w:'f'};
    if(op)n.options=op;
    if(cat)n.only=[cat];          // adding under a course tab limits the field to it
    S.fields.push(n);}
  await pt('cfg-f3',S.fields,true);
  logAct('field',lb,null,{act:id?'edit':'add',sub:lb});
  render();
}

  const m=Math.floor(s/60);if(m<60)return `${m} min`;

async function toggleRolePerm(rl,key,on){
  if(rl==='admin')return;                         // admin is fixed
  if(!S.rolePerms)S.rolePerms={};
  if(!S.rolePerms[rl])S.rolePerms[rl]=Object.assign({},ROLE_PERMS_DEFAULT[rl]);

  const tabs=['tabB','tabC','tabE','tabF','tabY','tabT'];
  const draft=Object.assign({},S.rolePerms[rl],{[key]:on?1:0});
  if(tabs.every(tk=>!draft[tk])){ alert(t('permMinOne')); reBT(); return; }
  S.rolePerms[rl][key]=on?1:0;

/* ================= BESTÄTIGUNG PDF GENERATION =================
   Lazy-loads jsPDF + qrcode from CDN, then draws the confirmation letter
   matching the school's layout. Returns a jsPDF doc. */
let _pdfLibs=null;
function loadScript(src){return new Promise((res,rej)=>{
  const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));
  document.head.appendChild(s);});}
async function ensurePdfLibs(){
  if(_pdfLibs)return _pdfLibs;
  if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  if(!window.QRCode)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js');
  _pdfLibs={jsPDF:(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF};
  return _pdfLibs;
}
/* Make a QR PNG dataURL for a URL, using qrcodejs (renders to a canvas). */
function qrDataUrl(text,size){return new Promise((res)=>{
  try{
    const holder=document.createElement('div');holder.style.display='none';document.body.appendChild(holder);
    new window.QRCode(holder,{text:text,width:size||120,height:size||120,correctLevel:window.QRCode.CorrectLevel.M});
    setTimeout(()=>{
      const cv=holder.querySelector('canvas'),img=holder.querySelector('img');
      let url='';
      if(cv)url=cv.toDataURL('image/png');
      else if(img)url=img.src;
      document.body.removeChild(holder);
      res(url);
    },60);
  }catch(e){res('');}
});}
/* Load an image URL → dataURL (needed so jsPDF can embed cross-origin PB images). */
function imgToDataUrl(url){return new Promise(async(res)=>{
  if(!url)return res(null);
  // Strategy 1: plain GET fetch -> blob -> dataURL. No custom headers, so no
  // CORS preflight. Works when the file endpoint sends Access-Control-Allow-Origin.
  try{
    const r=await fetch(url,{mode:'cors',credentials:'omit'});
    if(r.ok){
      const blob=await r.blob();
      const durl=await new Promise((rs)=>{const fr=new FileReader();fr.onload=()=>rs(fr.result);fr.onerror=()=>rs(null);fr.readAsDataURL(blob);});
      if(durl&&durl.length>50){
        const dim=await new Promise((rs)=>{const im=new Image();im.onload=()=>rs({w:im.naturalWidth,h:im.naturalHeight});im.onerror=()=>rs(null);im.src=durl;});
        return res({url:durl,w:(dim&&dim.w)||300,h:(dim&&dim.h)||420});
      }
    }
  }catch(e){}
  // Strategy 2: <img crossOrigin=anonymous> + canvas. Works when the server
  // sends CORS headers but the blob path failed for another reason.
  try{
    const out=await new Promise((rs)=>{
      const img=new Image();img.crossOrigin='anonymous';
      img.onload=()=>{try{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
        c.getContext('2d').drawImage(img,0,0);rs({url:c.toDataURL('image/jpeg',0.85),w:img.naturalWidth,h:img.naturalHeight});}
        catch(e){rs(null);}};
      img.onerror=()=>rs(null);
      img.src=url;
    });
    if(out)return res(out);
  }catch(e){}
  res(null);
});}

async function buildBestPDF(r,pre){
  const {jsPDF}=await ensurePdfLibs();
  const kind=(pre&&pre.kind)||bestKind(r);
  if(!kind)throw new Error('no template for this booking');
  const tpl=bestTpl(kind), vals=(pre&&pre.vals)||bestVals(r);
  // Make sure book cover images are loaded (they may not be if the PDF is
  // generated straight from the Bookings tab without opening Bestätigungen).
  if(!S.bookimg||!Object.keys(S.bookimg).length){try{await bookImgLoad();}catch(e){}}
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const PW=210, M=20, CW=PW-2*M;
  let y=16;
  const ink=[20,17,13], red=[194,57,43], grey=[90,82,73];

  // Logo (top-right), keep aspect
  const lw=52, lh=lw/LINGO_LOGO_RATIO;
  try{doc.addImage(LINGO_LOGO_PNG,'PNG',PW-M-lw,y,lw,lh);}catch(e){}
  // School address (top-left, small)
  doc.setFont('helvetica','normal').setFontSize(8).setTextColor(...grey);
  doc.text('Sprachschule LingoWelt',M,y+4);
  doc.text('Hegaustraße 23, 78224 Singen (Hohentwiel)',M,y+8);
  y+=Math.max(lh,10)+8;

  // Wichtiger Hinweis box (optional)
  if(tpl.hinweis){
    doc.setDrawColor(210,80,60).setLineWidth(0.4);
    const boxLines=doc.setFontSize(9).splitTextToSize(BEST_HINWEIS,CW-8);
    const bh=6+boxLines.length*4.3+4;
    doc.rect(M,y,CW,bh);
    doc.setTextColor(...red).setFont('helvetica','bold').text('Wichtiger Hinweis:',M+4,y+6);
    doc.setTextColor(...ink).setFont('helvetica','normal').text(boxLines,M+4,y+11);
    y+=bh+8;
  }

  // Title + place/date line
  doc.setFont('helvetica','bold').setFontSize(13).setTextColor(...ink);
  doc.text(tpl.title||'Anmeldebestätigung',PW/2,y,{align:'center'});
  doc.setFont('helvetica','normal').setFontSize(10);
  const today=new Date();
  const dstr=`Singen, ${String(today.getDate()).padStart(2,'0')}.${String(today.getMonth()+1).padStart(2,'0')}.${today.getFullYear()}`;
  doc.text(dstr,PW-M,y+8,{align:'right'});
  y+=16;

  // Greeting + intro
  doc.setFontSize(10.5).setTextColor(...ink);
  const line=(txt,dy)=>{const ls=doc.splitTextToSize(bestFill(txt,vals),CW);doc.text(ls,M,y);y+=ls.length*5+(dy||0);};
  if(tpl.greet){line(tpl.greet,3);}
  if(tpl.intro){line(tpl.intro,5);}

  // Detail rows (label + value columns) or bullets
  if(tpl.rows&&tpl.rows.length){
    doc.setFontSize(10.5);
    tpl.rows.forEach(rw=>{
      const lbl=bestFill(rw[0],vals), val=bestFill(rw[1],vals);
      const isFirst=tpl.rows.indexOf(rw)===0;
      doc.setTextColor(...(isFirst?red:ink));
      doc.text(lbl,M,y);
      doc.setTextColor(...(isFirst?red:ink));
      const vls=doc.splitTextToSize(val||'',CW-45);
      doc.text(vls,M+42,y);
      y+=Math.max(vls.length,1)*5+0.5;
    });
    y+=3;
  }
  if(tpl.bullets&&tpl.bullets.length){
    doc.setFontSize(10.5).setTextColor(...ink);
    tpl.bullets.forEach(b=>{
      const ls=doc.splitTextToSize('•  '+bestFill(b,vals),CW-4);
      doc.text(ls,M+2,y);y+=ls.length*5+1;
    });
    y+=3;
  }

  // Ort block
  if(tpl.ortLabel){
    doc.setTextColor(...ink).setFontSize(10.5);
    doc.text(tpl.ortLabel,M,y);
    const ortLines=BEST_ORT.split('\n');
    ortLines.forEach((l,i)=>doc.text(l,M+42,y+i*5));
    y+=ortLines.length*5+6;
  }

  // Books section (intro text + up to 2 images)
  if(tpl.books){
    if(tpl.booksIntro){doc.setFontSize(10.5).setTextColor(...ink);
      const ls=doc.splitTextToSize(bestFill(tpl.booksIntro,vals),CW);doc.text(ls,M,y);y+=ls.length*5+3;}
    const im1=await imgToDataUrl(bookImgUrl(vals.level,1));
    const im2=await imgToDataUrl(bookImgUrl(vals.level,2));
    const imgs=[im1,im2].filter(Boolean);
    if(imgs.length){
      const ih=42, gap=6; let x=M;
      imgs.forEach(im=>{const iw=ih*(im.w/im.h);
        try{doc.addImage(im.url,'JPEG',x,y,iw,ih);}catch(e){}
        x+=iw+gap;});
      y+=ih+6;
    }
  }

  // After-books text
  if(tpl.afterBooks){doc.setFontSize(10.5).setTextColor(...ink);
    const ls=doc.splitTextToSize(bestFill(tpl.afterBooks,vals),CW);doc.text(ls,M,y);y+=ls.length*5+4;}
  // Emphasised note (telc payment)
  if(tpl.emph){doc.setFont('helvetica','bold').setFontSize(10.5);
    const ls=doc.splitTextToSize(bestFill(tpl.emph,vals),CW);doc.text(ls,M,y);y+=ls.length*5+4;
    doc.setFont('helvetica','normal');}
  // Closing
  if(tpl.closing){doc.setFontSize(10.5).setTextColor(...ink);
    const ls=doc.splitTextToSize(bestFill(tpl.closing,vals),CW);doc.text(ls,M,y);y+=ls.length*5+4;}

  // QR bottom-right corner — the "Online prüfen" label goes BELOW it.
  const bid=(r&&r.id)||vals.id||'';
  const qurl=`https://book.lingowelt.com/?bestaetigung=${encodeURIComponent(bid)}`;
  const qr=await qrDataUrl(qurl,140);
  if(qr){
    const qs=24, qx=PW-M-qs, qy=252;   // fixed low position in the right corner
    try{doc.addImage(qr,'PNG',qx,qy,qs,qs);}catch(e){}
    doc.setFontSize(7).setTextColor(...grey);
    doc.text('Online prüfen',qx+qs/2,qy+qs+4,{align:'center'});
    doc.text(bid,qx+qs/2,qy+qs+7.5,{align:'center'});
  }

  // Footer
  doc.setFontSize(7.5).setTextColor(...grey);
  doc.text('Sprachschule LingoWelt · Hegaustraße 23, 78224 Singen · info@lingowelt.de · www.lingowelt.de',PW/2,288,{align:'center'});
  return doc;
}

   Deliberately excludes email, address, phone and all personal form fields. */
function publicBestData(r){
  const kind=bestKind(r), vals=bestVals(r), o=r.snap||{};
  return {
    id:r.id, kind:kind, level:vals.level, kurs:vals.kurs,
    name:vals.name, ort:BEST_ORT,
    start:vals.start, ende:vals.ende, datum:vals.datum,
    uhrzeit:vals.uhrzeit, examzeit:vals.examzeit, pruefdatum:vals.pruefdatum,

async function writePublicBest(r){
  const data=publicBestData(r);
  const key=r.id;
  // find existing
  let id=null;
  try{
    const q=await fetch(`${PB_URL}/api/collections/confirmations/records?filter=(key='${encodeURIComponent(key)}')&perPage=1`,{headers:authHead()});
    if(q.ok){const j=await q.json();id=(j.items&&j.items[0])?j.items[0].id:null;}
  }catch(e){}
  const body=JSON.stringify({key,data});
  try{
    const url=id?`${PB_URL}/api/collections/confirmations/records/${id}`:`${PB_URL}/api/collections/confirmations/records`;
    const rr=await fetch(url,{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json',...authHead()},body});
    return rr.ok;
  }catch(e){return false;}
}

async function readPublicBest(id){
  try{
    const r=await fetch(`${PB_URL}/api/collections/confirmations/records?filter=(key='${encodeURIComponent(id)}')&perPage=1`);
    if(!r.ok)return null;
    const j=await r.json();
    const it=(j.items&&j.items[0])||null;
    return it?(typeof it.data==='string'?JSON.parse(it.data):it.data):null;
  }catch(e){return null;}
}

function bestEmailHtml(r){
  const vals=bestVals(r);
  const url=`https://book.lingowelt.com/?bestaetigung=${encodeURIComponent(r.id)}`;
  return `<div style="font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#1a1a1a;line-height:1.6">
    <p>Sehr geehrte/r ${esc(vals.name||'Schüler/in')},</p>
    <p>hiermit bestätigen wir Ihre Anmeldung für <strong>${esc(vals.kurs)}</strong>.</p>
    <p>Ihre Anmeldebestätigung können Sie hier online ansehen und als PDF herunterladen:</p>
    <p><a href="${url}" style="display:inline-block;background:#f37027;color:#fff;text-decoration:none;padding:11px 22px;border-radius:8px;font-weight:bold">Bestätigung ansehen</a></p>
    <p style="font-size:13px;color:#666">Oder kopieren Sie diesen Link:<br>${url}</p>
    <p>Mit freundlichen Grüßen</p>
    ${LINGO_SIGNATURE_HTML}
  </div>`;
}
async function sendBestEmail(r){
  const to=bookingEmail(r);
  if(!to)return {ok:false,error:'no_email'};
  const body={
    to,
    subject:`Anmeldebestätigung — ${bestVals(r).kurs}`,
    text:bestEmailText(r),
    html:bestEmailHtml(r)
  };
  try{
    const resp=await fetch(`${PB_URL}/lingobook-send-confirmation`,{
      method:'POST',headers:{'Content-Type':'application/json',...authHead()},
      body:JSON.stringify(body)});
    if(!resp.ok){let d={};try{d=await resp.json();}catch(_){}
      return {ok:false,error:(d&&d.error)||('http_'+resp.status)};}
    return {ok:true,to};
  }catch(e){return {ok:false,error:'network'};}
}
/* Generate PDF + public record + send email. Used on confirm and on resend. */
async function bestGenerateAndSend(r,opts){
  opts=opts||{};
  // Ensure the public confirmation record exists so the link/QR page resolves.
  await writePublicBest(r);
  // Optional: also download the PDF locally (used by the detail modal button).
  if(opts.download){
    try{const doc=await buildBestPDF(r);doc.save(`Bestaetigung_${r.id}.pdf`);}catch(e){}
  }
  let mail={ok:false,error:'skipped'};
  if(opts.email!==false)mail=await sendBestEmail(r);
  return {mail};
}

function regsFor(offerId){
  const list=(S.cache||[]).filter(r=>r.snap&&r.snap.id===offerId&&!r.arch&&r.status!=='cancelled');
  return {
    all:list,
    confirmed:list.filter(r=>r.status==='confirmed'),
    pending:list.filter(r=>r.status==='pending'||!r.status)
  };
}
function capOf(offer){
  // Course capacity defaults to 12 when unset; exams use their 'seats' value.
  if(offer.max!==undefined&&offer.max!==null&&offer.max!=='')return +offer.max;
  if(offer.seats!==undefined&&offer.seats!==null&&offer.seats!=='')return +offer.seats;
  return 12;
}
/* One box (course or exam). */
function offerBox(offer,kind){
  const regs=regsFor(offer.id);
  const cap=capOf(offer);
  const taken=regs.all.length;
  const free=Math.max(0,cap-taken);
  const pct=cap>0?Math.min(100,Math.round(taken/cap*100)):0;
  const title=kind==='telc'?`telc ${offer.level}`:`${offer.level} ${offer.ct==='intensiv'?(S.lang==='de'?'Intensivkurs':'Intensive'):(S.lang==='de'?'Abendkurs':'Evening')}`;
  const when=kind==='telc'
    ? `${fdw(offer.date)}, ${fd(offer.date,true)}`
    : `${fd(offer.start)} — ${fd(offer.end)}`;
  const full=free<=0;
  const lbl=title.replace(/[^A-Za-z0-9]+/g,'_');
  const ids=regs.all.map(r=>r.id).join(',');
  return `<button class="offbox" onclick="S.offOpen=(S.offOpen==='${offer.id}'?null:'${offer.id}');reOff('${kind}')">
    <div class="offbox-hd">
      <div class="offbox-title">${esc(title)}</div>
      <div class="offbox-badges">
        ${taken>0?`<span class="offexp" title="${esc(t('exportCsv'))}" onclick="event.stopPropagation();exportRegs('${ids}','${lbl}')">⬇</span>`:''}
        <span class="offbox-free ${full?'full':''}">${full?esc(t('seatsFull')):esc(t('seatsFree').replace('{n}',free))}</span>
      </div>
    </div>
    <div class="offbox-when">${esc(when)}${offer.time?` · ${esc(offer.time)}`:''}</div>
    <div class="offbox-bar"><div class="offbox-barfill ${full?'full':''}" style="width:${pct}%"></div></div>
    <div class="offbox-meta">
      <span>${esc(t('ofSeats').replace('{a}',taken).replace('{b}',cap))}</span>
      <span class="offbox-split"><span class="dot cf"></span>${regs.confirmed.length} ${esc(t('regConfirmed'))} · <span class="dot pd"></span>${regs.pending.length} ${esc(t('regPending'))}</span>
    </div>
    ${S.offOpen===offer.id?offerRegList(regs,kind!=='telc'&&offer.ct==='intensiv'):''}
  </button>`;
}
function offerRegList(regs,showVisa){
  if(!regs.all.length)return `<div class="offreg-empty">${esc(t('noReg'))}</div>`;
  const rows=regs.all.slice().sort((a,b)=>{
    const sa=a.status==='confirmed'?0:1, sb=b.status==='confirmed'?0:1;
    if(sa!==sb)return sa-sb;
    return nmOf(a).localeCompare(nmOf(b));
  }).map(r=>{
    const conf=r.status==='confirmed';const ph=phOf(r);
    const visa=(showVisa&&needsVisa(r))?`<span class="visa-tag" title="Visum benötigt">V</span>`:'';
    return `<div class="offreg-row ${conf?'cf':'pd'}">
      ${visa}<span class="offreg-dot ${conf?'cf':'pd'}"></span>
      <span class="offreg-name">${esc(nmOf(r))}</span>
      <span class="offreg-em">${esc(emOf(r))}${ph?` · ${esc(ph)}`:''}</span>
      <span class="offreg-st ${conf?'cf':'pd'}">${esc(conf?t('regConfirmed'):t('regPending'))}</span>
    </div>`;}).join('');
  return `<div class="offreg" onclick="event.stopPropagation()">${rows}</div>`;
}

/* ---- Einstufungstest state ---- */
const EST={lvKey:null,q:0,answers:{},answered:new Set(),correctness:{},score:0,submitting:false,
  screen:'levels',contact:{firstName:'',lastName:'',email:'',consent:false},blockedMsg:''};
const EST_MAX_ATTEMPTS=2;
const EST_ATT_KEY='lingowelt_einstufung_attempts_v2';
function estLoadAttempts(){try{const r=localStorage.getItem(EST_ATT_KEY);return r?JSON.parse(r):{};}catch(e){return {};}}
function estSaveAttempts(m){try{localStorage.setItem(EST_ATT_KEY,JSON.stringify(m));}catch(e){}}
const estAttempts=estLoadAttempts();
function estAttemptKey(code,email){return code+'|'+(email||'').trim().toLowerCase();}
function estSplitName(full){const t=(full||'').trim().replace(/\s+/g,' ');const i=t.indexOf(' ');
  return i===-1?{firstName:t,lastName:''}:{firstName:t.slice(0,i),lastName:t.slice(i+1)};}
function estJoinName(f,l){return [f,l].filter(Boolean).join(' ');}

/* Entry point from the home banner */
function startEst(){
  EST.lvKey=null;EST.screen='levels';estResetQuiz();
  S.view='est';render();
}
function estResetQuiz(){EST.q=0;EST.answers={};EST.answered=new Set();EST.correctness={};EST.score=0;EST.submitting=false;}
function estBackHome(){if(S.adminMode){S.view='home';render();}else{location.href='https://lingowelt.de';}}

/* Render dispatcher for the est view (called from render()) */
function vEst(){
  const s=EST.screen;
  let inner='';
  if(s==='levels')inner=estVLevels();
  else if(s==='contact')inner=estVContact();
  else if(s==='quiz')inner=estVQuiz();
  else if(s==='blocked')inner=estVBlocked();
  else if(s==='results')inner=estVResults();
  else inner=estVLevels();
  return `<div class="est-scope">${inner}</div>`;
}
function estRe(){if(S.view==='est'){const el=document.getElementById('app');if(el)el.innerHTML=vEst();}}

function estVLevels(){
  const cards=Object.keys(LEVELS).map(k=>{const lv=LEVELS[k];return `
    <button class="est-lvcard" onclick="estStartLevel('${k}')">
      <div class="est-lvtop">
        <div class="est-stamp ${lv.tier}"><span>${lv.code}</span></div>
        <h2>${esc(lv.name)}</h2>
      </div>
      <p class="est-lvdesc">${esc(lv.tagline)}</p>
      <p class="est-lvmeta">${esc(lv.meta)}</p>
    </button>`;}).join('');
  return `<div class="est-hero">
      <p class="est-eyebrow">LingoWelt · Offizielles telc Prüfungszentrum</p>
      <h1>Wie gut ist dein Deutsch?</h1>
      <p>Wähle ein Niveau und finde in rund 20 Minuten heraus, wo du gerade stehst. Am Ende bekommst du eine Einschätzung, mit der wir dich in den passenden Kurs einstufen.</p>
    </div>
    <div class="est-lvgrid">${cards}</div>
    <div style="text-align:center;margin-top:26px"><button class="est-ghost" onclick="estBackHome()">← Zurück zur Startseite</button></div>`;
}

function estStartLevel(k){
  EST.lvKey=k;estResetQuiz();EST.screen='contact';estRe();
}

function estVContact(){
  const lv=LEVELS[EST.lvKey];
  const c=EST.contact;
  return `<div class="est-panel-wrap"><div class="est-panel">
    <div class="est-stamp ${lv.tier}"><span>${lv.code}</span></div>
    <h2>Bevor es losgeht</h2>
    <p>Trag deine Daten ein, damit wir dir dein Ergebnis zuordnen können.</p>
    <div class="est-field"><label for="estName">Vor- und Nachname</label>
      <input type="text" id="estName" placeholder="Ihr Vor- und Nachname" value="${esc(estJoinName(c.firstName,c.lastName))}" oninput="estValidate()"></div>
    <div class="est-field"><label for="estEmail">E-Mail Adresse</label>
      <input type="email" id="estEmail" placeholder="ihre.email@example.com" value="${esc(c.email)}" oninput="estValidate()"></div>
    <div class="est-cbwrap"><label class="est-cblabel">
      <input type="checkbox" id="estConsent" ${c.consent?'checked':''} onchange="estValidate()">
      <span><span class="est-cbtitle">Einverständnis zur Kontaktaufnahme</span>
      <span class="est-cbdesc">Ich bin damit einverstanden, dass mich LingoWelt zu meinem Ergebnis und passenden Kursen kontaktiert.</span></span>
    </label></div>
    <div id="estContactErr" class="est-err" hidden></div>
    <button id="estStartBtn" class="est-btn pri block" style="margin-top:20px" onclick="estBeginQuiz()" disabled>Test starten</button>
    <p class="est-hint">Hinweis: Dieser Test kann pro Person maximal 2 Mal gemacht werden.</p>
    <button class="est-ghost" style="margin-top:8px" onclick="EST.screen='levels';estRe()">← Anderes Niveau</button>
  </div></div>`;
}

function estValidate(){
  const nm=document.getElementById('estName'),em=document.getElementById('estEmail'),cb=document.getElementById('estConsent');
  if(!nm||!em||!cb)return;
  const {firstName,lastName}=estSplitName(nm.value);
  const ok=firstName&&lastName&&em.value.trim()&&em.validity.valid&&cb.checked;
  const btn=document.getElementById('estStartBtn');if(btn)btn.disabled=!ok;
}

async function estBeginQuiz(){
  const nm=document.getElementById('estName').value.trim();
  const {firstName,lastName}=estSplitName(nm);
  const email=document.getElementById('estEmail').value.trim();
  const consent=document.getElementById('estConsent').checked;
  const errEl=document.getElementById('estContactErr');
  const showErr=m=>{errEl.textContent=m;errEl.hidden=false;};
  if(!firstName||!lastName||!email||!consent){
    const miss=[];if(!firstName||!lastName)miss.push('Vor- und Nachname');if(!email)miss.push('E-Mail');if(!consent)miss.push('Einverständnis');
    showErr('Bitte ausfüllen: '+miss.join(', '));return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErr('Bitte geben Sie eine gültige E-Mail-Adresse ein.');return;}
  errEl.hidden=true;
  EST.contact={firstName,lastName,email,consent};
  const lv=LEVELS[EST.lvKey];
  const key=estAttemptKey(lv.code,email);
  // Kufiri: vetëm nga localStorage. Bllokohet vetëm kur ka bërë tashmë >= 2 teste të plota.
  if((estAttempts[key]||0)>=EST_MAX_ATTEMPTS){EST.blockedMsg=estBlockedText(lv);EST.screen='blocked';estRe();return;}
  EST.screen='quiz';EST.q=0;estRe();
}
function estBlockedText(lv){return `Du hast den ${lv.code}-Test bereits ${EST_MAX_ATTEMPTS} Mal gemacht. Wir haben deine Ergebnisse erhalten und melden uns so schnell wie möglich bei dir!`;}

function estVBlocked(){
  return `<div class="est-panel-wrap"><div class="est-panel">
    <div class="est-stamp done">✓</div>
    <h2>Du hast diesen Test schon gemacht</h2>
    <p class="est-rdesc" style="margin-top:18px">${esc(EST.blockedMsg)}</p>
    <div class="est-ractions"><button class="est-btn sec block" onclick="EST.screen='levels';estRe()">Anderes Niveau wählen</button></div>
  </div></div>`;
}

function estVQuiz(){
  const lv=LEVELS[EST.lvKey];const q=lv.questions[EST.q];
  const pct=((EST.q+1)/lv.questions.length)*100;
  const correctAnswers=Array.isArray(q.correct)?q.correct:[q.correct];
  const selected=EST.answers[q.id]||[];
  const isAnswered=EST.answered.has(q.id);
  const ansHtml=q.options.map(opt=>{
    let cls='est-ans';
    if(isAnswered){cls+=' answered';if(correctAnswers.includes(opt.id))cls+=' correct';else if(selected.includes(opt.id))cls+=' incorrect';}
    else if(selected.includes(opt.id))cls+=' selected';
    const click=isAnswered?'':`onclick="estPick('${opt.id}')"`;
    return `<button class="${cls}" ${click}><span class="est-let">${opt.id.toUpperCase()}</span><span>${opt.text}</span></button>`;
  }).join('');
  const isLast=EST.q===lv.questions.length-1;
  return `<div class="est-topbar">
      <button class="est-ghost" onclick="estBackHome()">← Startseite</button>
      <div class="est-chip">${lv.code}</div>
      <div class="est-pwrap">
        <div class="est-ptrack"><div class="est-pfill" style="width:${pct}%"></div></div>
        <div class="est-plabel"><span>Frage ${EST.q+1} von ${lv.questions.length}</span><span>Punkte: ${EST.score}</span></div>
      </div>
    </div>
    <div class="est-qcard">
      <div class="est-qtext">${q.text}</div>
      ${q.section?`<div class="est-passage">${q.section}</div>`:''}
      ${q.note?`<div class="est-note">${esc(q.note)}</div>`:''}
      <div class="est-answers">${ansHtml}</div>
    </div>
    <div class="est-nav">
      <button class="est-btn out" ${EST.q===0?'disabled':''} onclick="estPrev()">← Zurück</button>
      <button class="est-btn pri" ${isAnswered?'':'disabled'} onclick="estNext()">${isLast?'Ergebnis ansehen →':'Weiter →'}</button>
    </div>`;
}

function estPick(optId){
  const lv=LEVELS[EST.lvKey];const q=lv.questions[EST.q];
  const correctAnswers=Array.isArray(q.correct)?q.correct:[q.correct];
  if(EST.answered.has(q.id))return;
  if(q.type==='radio'){EST.answers[q.id]=[optId];estFinalize(q);}
  else{ // checkbox
    let up=[...(EST.answers[q.id]||[])];
    if(!up.includes(optId)&&up.length<correctAnswers.length)up.push(optId);
    EST.answers[q.id]=up;
    if(up.length===correctAnswers.length)estFinalize(q);
  }
  estRe();
}
function estFinalize(q){
  const correctAnswers=Array.isArray(q.correct)?q.correct:[q.correct];
  const sel=EST.answers[q.id]||[];
  const ok=sel.length===correctAnswers.length&&sel.every(id=>correctAnswers.includes(id));
  if(!EST.answered.has(q.id)&&ok)EST.score++;
  EST.correctness[q.id]=ok;EST.answered.add(q.id);
}
function estNext(){
  const lv=LEVELS[EST.lvKey];
  if(EST.q<lv.questions.length-1){EST.q++;estRe();window.scrollTo({top:0,behavior:'smooth'});}
  else estFinish();
}
function estPrev(){if(EST.q>0){EST.q--;estRe();window.scrollTo({top:0,behavior:'smooth'});}}

function estRecommend(pct,code){
  if(pct>=85)return `Ausgezeichnet! Dein Ergebnis liegt über dem Niveau ${code} — sprich uns gerne auf den nächsthöheren Kurs an.`;
  if(pct>=60)return `Sehr gut! Niveau ${code} passt gut zu deinem aktuellen Sprachstand.`;
  if(pct>=40)return `Solide Basis. Ein Kurs auf Niveau ${code} hilft dir, dich sicherer zu fühlen.`;
  return `Kein Problem — wir empfehlen dir, mit den Grundlagen in Niveau ${code} zu starten.`;
}

async function estFinish(){
  if(EST.submitting)return;EST.submitting=true;
  const lv=LEVELS[EST.lvKey];
  const percentage=Math.round((EST.score/lv.questions.length)*100);
  estAttempts[estAttemptKey(lv.code,EST.contact.email)]=(estAttempts[estAttemptKey(lv.code,EST.contact.email)]||0)+1;
  estSaveAttempts(estAttempts);
  EST.lastPct=percentage;
  EST.screen='results';estRe();
  // submit to PocketBase only (non-blocking)
  const payload={...EST.contact,score:EST.score,percentage};
  try{await estSubmitPB(lv,payload);}catch(e){console.warn('est submit failed',e);}
  EST.submitting=false;
}

async function estSubmitPB(lv,data){
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),6000);
  try{
    const id='est:'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
    const value={firstName:data.firstName,lastName:data.lastName,email:data.email,level:lv.code,
      score:data.score,percentage:data.percentage,total:(lv.questions?lv.questions.length:null),
      lang:S.lang||'de',at:new Date().toISOString()};
    await fetch(`${PB_URL}/api/collections/lingobook/records`,{method:'POST',signal:ctrl.signal,
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({key:id,value:value,shared:true,email:(data.email||'').toLowerCase()})});
    // Notify the admin activity feed (bell). Direct POST — students are anonymous
    // and have no list rights, so we must NOT go through pt()/_pbFind here.
    try{
      const nm=((data.firstName||'')+' '+(data.lastName||'')).trim()||data.email||'—';
      const label=`${nm} · ${lv.code} · ${data.percentage}%`;
      const akey='alog:'+Date.now().toString().padStart(16,'0')+'-'+Math.random().toString(36).slice(2,6);
      const arec={t:'est',msg:{de:label,en:label},who:'system',at:new Date().toISOString(),ref:id,sub:{de:'Einstufungstest',en:'Placement test'}};
      await fetch(`${PB_URL}/api/collections/lingobook/records`,{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({key:akey,value:arec,shared:true})});
    }catch(e){/* notification is best-effort */}
  }finally{clearTimeout(to);}
}

function estVResults(){
  const lv=LEVELS[EST.lvKey];const pct=EST.lastPct;
  return `<div class="est-panel-wrap"><div class="est-panel">
    <div class="est-stamp result"><span>${pct}%</span></div>
    <h2>Test abgeschlossen</h2>
    <p class="est-rlabel">${lv.code} Einstufungstest abgeschlossen</p>
    <div class="est-stats">
      <div><span>${EST.score}/${lv.questions.length}</span><label>Punkte</label></div>
      <div><span>${pct}%</span><label>Ergebnis</label></div>
    </div>
    <p class="est-rdesc">${esc(estRecommend(pct,lv.code))}</p>
    <div class="est-ractions">
      <button class="est-btn pri block" onclick="estStartLevel('${EST.lvKey}')">Nochmal versuchen</button>
      <button class="est-btn sec block" onclick="EST.screen='levels';estRe()">Anderes Niveau wählen</button>
      <button class="est-btn out block" onclick="estShare()">Per WhatsApp teilen</button>
    </div>
  </div></div>`;
}
function estShare(){
  const lv=LEVELS[EST.lvKey];const pct=EST.lastPct;
  const msg=`Ich habe den LingoWelt ${lv.code} Einstufungstest gemacht! 🎉\n\nErgebnis: ${pct}%\nPunkte: ${EST.score}/${lv.questions.length}\n\nMach den Test auch: https://lingowelt.de`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}


boot();
</script>
