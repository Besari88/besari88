<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingoWelt — Buchung / Booking</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --or:#f37027;
  --or-d:#c2530f;
  --or-w:#fff3ec;
  --gr:#3aaf4a;
  --gr-d:#1f5e28;
  --gr-w:#e9f7ea;
  --ink:#14110d;
  --i2:#5a5249;
  --i3:#948a7e;
  --ln:#e8e2d8;
  --ln2:#f2eee7;
  --bg:#fbfaf7;
  --cd:#fff;
  --rd:#c0392b;
  --rd-w:#fdecea;
  --am:#9a6a08;
  --am-w:#fdf2da;
  --r:14px;
  --r2:10px;
  --sh:0 1px 2px rgba(20,17,13,.04),0 6px 20px -10px rgba(20,17,13,.13);
  --sh2:0 2px 6px rgba(20,17,13,.05),0 24px 50px -22px rgba(20,17,13,.25);
  --fd:'Bricolage Grotesque',system-ui,sans-serif;
  --fb:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--fb);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fd);margin:0 0 .35em;font-weight:800;letter-spacing:-.02em;line-height:1.15}
p{margin:0 0 1em;line-height:1.6;color:var(--i2)}
button{font-family:var(--fb);cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:var(--fb)}
:focus-visible{outline:2.5px solid var(--or);outline-offset:2px;border-radius:4px}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}
.site{min-height:100vh;display:flex;flex-direction:column}

.top{background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:40}
.tin{max-width:1060px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:9px;cursor:pointer}
.lg .lwlogo{height:30px;width:auto;display:block}
@media(max-width:520px){.lg .lwlogo{height:26px}}
.nav{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.nav>button{padding:8px 13px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--i2)}
.nav>button:hover{background:var(--ln2);color:var(--ink)}
.lang{display:flex;gap:2px;background:var(--ln2);border-radius:99px;padding:3px;margin-left:5px}
.lang button{padding:5px 11px;border-radius:99px;font-size:12px;font-weight:800;color:var(--i3)}
.lang button.on{background:var(--ink);color:#fff}

.main{flex:1;padding:34px 0 80px}
.foot{border-top:1px solid var(--ln);padding:20px 0;text-align:center;font-size:12px;color:var(--i3)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vw{animation:rise .3s cubic-bezier(.2,.7,.3,1)}
@media(prefers-reduced-motion:reduce){.vw{animation:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:99px;font-weight:700;font-size:14.5px;transition:.16s;white-space:nowrap}
.bp{background:var(--ink);color:#fff}
.bp:hover:not(:disabled){background:#2e281f;transform:translateY(-1px);box-shadow:var(--sh)}
.bp:disabled{background:#d8d2c8;cursor:not-allowed}
.bo{background:var(--or);color:#fff}
.bo:hover:not(:disabled){background:var(--or-d);transform:translateY(-1px);box-shadow:var(--sh)}
.bo:disabled{background:#e3ddd3;color:#fff;cursor:not-allowed;transform:none}
.bs{background:#fff;color:var(--ink);border:1.5px solid var(--ln)}
.bs:hover{border-color:var(--i3)}
.bd{background:var(--rd-w);color:var(--rd)}
.bsm{padding:8px 14px;font-size:12.5px}
.bfull{width:100%}
.brow{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.back{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--i3);margin-bottom:18px}
.back:hover{color:var(--ink)}

/* ===== Hero / home ===== */
.hero{text-align:center;max-width:600px;margin:6px auto 40px}
.hero h1{font-size:38px}
.hero h1 em{font-style:normal;position:relative;white-space:nowrap}
.hero h1 em::after{content:'';position:absolute;left:-2px;right:-2px;bottom:4px;height:9px;background:var(--or-w);border-radius:3px;z-index:-1}
.brow2{display:inline-flex;align-items:center;gap:6px;background:var(--gr-w);color:var(--gr-d);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 13px;border-radius:99px;margin-bottom:15px}
.brow2::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gr)}
/* ===== Tile grid ===== */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr);gap:10px}}
.tiles.small{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.tiles.small{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.tiles.small{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);padding:22px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  aspect-ratio:1/.92;transition:.18s;position:relative;overflow:hidden}
@media(max-width:480px){.tile{padding:16px 8px;gap:8px}}
.tile::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ac);transform:scaleX(0);transition:.2s}
.tile:hover{border-color:var(--i3);box-shadow:var(--sh2);transform:translateY(-2px)}
.tile:hover::after{transform:scaleX(1)}
.tile.on{border-color:var(--or);background:var(--or-w);box-shadow:0 0 0 3px rgba(243,112,39,.13)}
.tile .ti{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--ln);display:flex;
  align-items:center;justify-content:center;font-size:24px;background:var(--bg);flex-shrink:0}
@media(max-width:480px){.tile .ti{width:46px;height:46px;font-size:20px}}
.tile:hover .ti{border-color:var(--ac)}
.tile .ti.lvti{font-family:var(--fd);font-weight:800;font-size:19px;color:var(--ink);letter-spacing:-.02em}
.tile .tn{font-family:var(--fd);font-weight:700;font-size:14px;text-align:center;line-height:1.3;letter-spacing:-.01em}
@media(max-width:480px){.tile .tn{font-size:12.5px}}
.tile .ts{font-size:11px;color:var(--i3);font-weight:600}
.tile .ti svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:480px){.tile .ti svg{width:20px;height:20px}}
.tile.single{border-style:dashed}
.tile.single:hover{border-style:solid;border-color:var(--or);background:var(--or-w)}
.hico{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;
  border:1.5px solid var(--ln);background:var(--cd);font-size:24px;margin-bottom:12px}
.alt{text-align:center;margin-top:24px;font-size:13px;color:var(--i3)}
.lnkb{display:block;margin:8px auto 0;font-weight:700;font-size:13.5px;color:var(--or-d);text-decoration:underline}
.lnkb:hover{color:var(--ink)}
.crumb a:hover{color:var(--or-d);text-decoration:underline}

/* ===== Burger (mobile) ===== */
.burger{display:none;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--ln);
  align-items:center;justify-content:center;flex-direction:column;gap:4px;background:#fff}
.burger span{display:block;width:16px;height:2px;background:var(--ink);border-radius:2px;transition:.2s}
.burger.x span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger.x span:nth-child(2){opacity:0}
.burger.x span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
@media(max-width:760px){
  .burger{display:flex}
  .nav{position:fixed;top:60px;right:12px;left:12px;background:#fff;border:1px solid var(--ln);
    border-radius:var(--r);box-shadow:var(--sh2);padding:10px;flex-direction:column;align-items:stretch;
    gap:2px;display:none;z-index:50}
  .nav.open{display:flex}
  .nav>button{text-align:left;padding:13px 14px;font-size:15px;border-radius:10px}
  .lang{margin:6px 0 0;justify-content:center}
  .lang button{flex:1;padding:9px}
}

/* ===== Product page ===== */
.prod{display:grid;grid-template-columns:1fr 1.15fr;gap:38px;align-items:start}
@media(max-width:900px){.prod{grid-template-columns:1fr;gap:24px}}
.pleft{position:sticky;top:88px}
@media(max-width:900px){.pleft{position:static}}
.phero{border-radius:var(--r);overflow:hidden;background:var(--tint,linear-gradient(140deg,var(--or-w),var(--gr-w)));border:1px solid var(--ln);padding:34px 30px;min-height:290px;display:flex;flex-direction:column;justify-content:space-between}
.phero .pmic{width:52px;height:52px;border-radius:14px;background:var(--iconbg,var(--gr-d));display:inline-flex;
  align-items:center;justify-content:center;margin-bottom:18px;font-size:26px}
.phero .pmic svg{width:27px;height:27px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.phero .big{font-family:var(--fd);font-weight:800;font-size:64px;letter-spacing:-.04em;line-height:1;color:var(--titc,var(--ink))}
.phero .sm{font-size:13.5px;color:var(--subc,var(--i2));font-weight:600;margin-top:6px}
.trust{display:flex;flex-direction:column;gap:9px;margin-top:24px}
.trust div{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--i2);font-weight:600}
.trust b{width:18px;height:18px;border-radius:50%;background:var(--cd);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--gr-d);flex-shrink:0}
.crumb{font-size:12px;color:var(--i3);font-weight:600;margin-bottom:10px}
.crumb span{color:var(--ink)}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
.phead h1{font-size:27px;margin:0}
.ptag{font-family:var(--fd);font-weight:800;font-size:21px;background:var(--or-w);color:var(--or-d);padding:5px 12px;border-radius:8px;white-space:nowrap}
.facts{list-style:none;padding:0;margin:0 0 28px}
.facts li{position:relative;padding:0 0 0 22px;margin-bottom:8px;font-size:13.5px;color:var(--i2);line-height:1.55}
.facts li::before{content:'';position:absolute;left:5px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--or)}
.facts li b{color:var(--ink);font-weight:700}
.sec{margin-bottom:26px}
.sec>h3{font-size:15.5px;margin-bottom:11px;display:flex;align-items:center;gap:6px}
.sec>h3 i{font-style:normal;color:var(--or)}

/* mode cards (Schule / Online) */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mode{border:2px solid var(--ln);border-radius:var(--r2);padding:20px 14px;background:#fff;text-align:center;transition:.16s}
.mode:hover{border-color:var(--or);background:var(--or-w)}
.mode.on{border-color:var(--or);background:var(--or-w);box-shadow:0 0 0 3px rgba(243,112,39,.13)}
.mode svg{width:36px;height:36px;margin:0 auto 8px;display:block;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mode span{font-size:13px;font-weight:700}
.mode small{display:block;font-size:11px;color:var(--i3);margin-top:2px;font-weight:600}

/* level chips */
.lvs{display:flex;gap:8px;flex-wrap:wrap}
.lv{flex:1;min-width:62px;border:2px solid var(--ln);border-radius:var(--r2);padding:13px 8px;background:#fff;
  font-family:var(--fd);font-weight:800;font-size:16px;letter-spacing:-.01em;transition:.15s}
.lv:hover{border-color:var(--or);background:var(--or-w)}
.lv.on{border-color:var(--or);background:var(--or);color:#fff;box-shadow:0 0 0 3px rgba(243,112,39,.15)}
/* hour packages */
.hrs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:560px){.hrs{grid-template-columns:repeat(2,1fr)}}
.hr{border:2px solid var(--ln);border-radius:var(--r2);padding:14px 8px;background:#fff;transition:.15s;text-align:center}
.hr:hover{border-color:var(--or);background:var(--or-w)}
.hr.on{border-color:var(--or);background:var(--or-w);box-shadow:0 0 0 3px rgba(243,112,39,.13)}
.hr b{display:block;font-family:var(--fd);font-size:21px;font-weight:800;line-height:1}
.hr span{display:block;font-size:10.5px;color:var(--i3);font-weight:700;margin:3px 0 5px}
.hr i{font-style:normal;font-family:var(--fd);font-weight:800;font-size:13.5px;color:var(--or-d)}
/* date rows */
.dates{background:var(--ln2);border-radius:var(--r2);padding:9px}
.dt{width:100%;display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid transparent;border-radius:8px;padding:13px 14px;margin-bottom:7px;transition:.15s;text-align:left}
.dt:last-of-type{margin-bottom:0}
.dt:hover:not(:disabled){border-color:var(--or)}
.dt.on{border-color:var(--or);background:var(--or-w);box-shadow:0 0 0 2px rgba(243,112,39,.12)}
.dt:disabled{opacity:.55;cursor:not-allowed}
.rdo{width:17px;height:17px;border-radius:50%;border:2px solid var(--ln);flex-shrink:0;position:relative;transition:.15s}
.dt.on .rdo{border-color:var(--or);border-width:5px}
.dt-m{flex:1;min-width:0}
.dt-m .d1{font-weight:700;font-size:14px;font-family:var(--fd);letter-spacing:-.01em}
.dt-m .d2{font-size:11.5px;color:var(--i3);margin-top:2px;font-weight:600}
.st{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.st.free{background:var(--gr-w);color:var(--gr-d)}
.st.few{background:var(--am-w);color:var(--am)}
.st.out{background:var(--rd-w);color:var(--rd)}
.more{width:100%;text-align:left;padding:11px 14px 4px;font-size:13px;font-weight:700;color:var(--ink)}
.more:hover{color:var(--or-d)}

/* package cards */
.paks{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:560px){.paks{grid-template-columns:1fr}}
.pak{border:2px solid var(--ln);border-radius:var(--r2);padding:17px;background:#fff;text-align:left;transition:.16s;position:relative}
.pak:hover{border-color:var(--or)}
.pak.on{border-color:var(--or);background:var(--or-w);box-shadow:0 0 0 3px rgba(243,112,39,.13)}
.pak-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.pak-h b{font-family:var(--fd);font-size:15px;font-weight:800}
.pak-h i{font-style:normal;font-family:var(--fd);font-weight:800;font-size:15px}
.pak ul{list-style:none;padding:0;margin:0}
.pak li{font-size:12.5px;color:var(--i2);padding-left:19px;position:relative;margin-bottom:5px;line-height:1.45}
.pak li::before{content:'✓';position:absolute;left:0;top:-1px;color:var(--gr-d);font-weight:800;font-size:12px}
.pak li.strike{color:var(--gr-d);font-weight:700}
.pak li.strike::before{content:'✓'}
.pak li.strike s{color:var(--i3);font-weight:400}
.save{position:absolute;top:-9px;right:11px;background:var(--rd);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;letter-spacing:.02em}
/* exam type list */
.tl{background:var(--ln2);border-radius:var(--r2);padding:9px}
.tl button{width:100%;display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid transparent;border-radius:8px;padding:12px 14px;margin-bottom:7px;text-align:left;transition:.15s}
.tl button:last-child{margin-bottom:0}
.tl button:hover{border-color:var(--or)}
.tl button.on{border-color:var(--or);background:var(--or-w)}
.tl .tx{font-size:13.5px;font-weight:700}
.tl .tx small{display:block;font-weight:500;font-size:11.5px;color:var(--i3);margin-top:1px}

/* sticky buy bar */
.buy{position:sticky;bottom:0;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:var(--r);padding:11px;display:flex;align-items:center;gap:11px;box-shadow:var(--sh2);margin-top:26px;z-index:20}
.buy .amt{flex:1;padding-left:9px;min-width:0}
.buy .amt .n{font-family:var(--fd);font-weight:800;font-size:24px;letter-spacing:-.02em}
.buy .amt .l{font-size:11px;color:var(--i3);font-weight:600;margin-top:1px}
.buy .btn{padding:15px 26px;font-size:15px}
@media(max-width:520px){.buy{flex-direction:column;align-items:stretch}.buy .amt{text-align:center;padding:4px 0}.buy .btn{width:100%}}
.hint{font-size:11.5px;color:var(--i3);text-align:center;margin-top:9px}

/* ===== Form page ===== */
.fpage{max-width:760px;margin:0 auto}
.recap{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);padding:18px 20px;margin-bottom:22px;box-shadow:var(--sh)}
.recap h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--i3);font-family:var(--fb);font-weight:800;margin-bottom:9px}
.recap .rr{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:13.5px}
.recap .rr .k{color:var(--i3)}
.recap .rr .v{font-weight:700;text-align:right}
.recap .rr.tt{border-top:1.5px solid var(--ink);margin-top:7px;padding-top:9px}
.recap .rr.tt .v{font-family:var(--fd);font-size:18px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);padding:28px;box-shadow:var(--sh);margin-bottom:18px}
@media(max-width:560px){.card{padding:20px 17px}}
.card>h2{font-size:20px;margin-bottom:4px}
.card>.cs{font-size:13px;color:var(--i3);margin-bottom:20px}
.alert{background:var(--rd-w);color:var(--rd);border-left:3px solid var(--rd);border-radius:8px;padding:13px 15px;font-size:13px;line-height:1.55;margin-bottom:22px;font-weight:500}
.f{margin-bottom:16px}
.f>label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.rq{color:var(--or-d)}
.f input[type=text],.f input[type=email],.f input[type=tel],.f select,.f textarea{width:100%;padding:12px 14px;border:1.5px solid var(--ln);border-radius:var(--r2);font-size:14.5px;color:var(--ink);background:#fff;transition:.15s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,17,13,.06)}
.f textarea{resize:vertical;min-height:76px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.g3{display:grid;grid-template-columns:.7fr 1fr 1fr;gap:13px}
.gst{display:grid;grid-template-columns:1fr .38fr;gap:13px}
.gpz{display:grid;grid-template-columns:.45fr 1fr;gap:13px}
.d3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:9px}
@media(max-width:600px){.g2,.g3,.gst,.gpz{grid-template-columns:1fr}}
.opt{display:flex;align-items:flex-start;gap:10px;padding:13px 15px;border:1.5px solid var(--ln);border-radius:var(--r2);cursor:pointer;font-size:13.5px;line-height:1.5;margin-bottom:9px;transition:.14s}
.opt:hover{border-color:var(--i3);background:#fdfcfa}
.opt:has(input:checked){border-color:var(--or);background:var(--or-w)}
.opt input{margin-top:2px;flex-shrink:0;accent-color:var(--or);width:16px;height:16px}
.opt.bare{border:none;padding:0;background:none}
.opt.bare:hover{background:none}
/* Consent checkboxes sit alone in their own card — give them room to breathe. */
.card .opt input[type=checkbox]{width:18px;height:18px;margin-top:1px}
.card .f:has(.opt input[type=checkbox]){margin-bottom:11px}
.err{color:var(--rd);font-size:12.5px;font-weight:600;margin-top:6px}
.hp{font-size:11.5px;color:var(--i3);margin-top:5px}
.lk{font-weight:700;color:var(--ink);text-decoration:underline}

/* ===== Confirm ===== */
.done{text-align:center;max-width:520px;margin:0 auto}
.done .bg{width:56px;height:56px;border-radius:50%;background:var(--gr-w);color:var(--gr-d);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px}
.bid{font-family:var(--fd);font-size:23px;font-weight:800;letter-spacing:.04em;background:var(--ink);color:#fff;padding:11px 22px;border-radius:var(--r2);display:inline-block;margin:6px 0 4px}

.sts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}

.stc{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r2);padding:14px 16px;text-align:left}
.stc .n{font-family:var(--fd);font-size:25px;font-weight:800}
.stc .l{font-size:11px;color:var(--i3);font-weight:700;text-transform:uppercase;margin-top:2px;display:flex;align-items:center;gap:4px}
.stc-btn{cursor:pointer;transition:border-color .15s,background .15s}
.stc-btn:hover{border-color:var(--or);background:var(--or-w)}
.stc-btn .l .mi{width:13px;height:13px}
.rstf{width:40px;height:40px;flex-shrink:0;border:1.5px solid var(--ln);border-radius:var(--r2);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--i2);transition:transform .35s,border-color .15s,color .15s}
.rstf:hover{border-color:var(--or);color:var(--or-d)}
.rstf:hover .mi{transform:rotate(-180deg)}
.rstf .mi{width:18px;height:18px;transition:transform .35s}
.rstf.off{opacity:.45}
.rstf.csvb{width:auto;padding:0 13px;gap:6px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.rstf.csvb .lb{letter-spacing:.02em}
.rstf.csvb:hover{border-color:var(--or);color:var(--or-d)}
.mi{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.ib .mi{width:15px;height:15px}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:var(--r2)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
th{background:var(--bg);text-align:left;padding:11px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--i3);font-weight:800;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--ln2)}
tr:last-child td{border:none}
tr:hover td{background:#fdfcfa}
.acts{display:flex;gap:5px}
.ib{width:29px;height:29px;border-radius:7px;border:1.5px solid var(--ln);display:inline-flex;align-items:center;justify-content:center;font-size:13px;background:#fff;cursor:pointer}
.ib.danger{border-color:#e7b4a8;background:#fdf2ee}.ib.danger:hover{background:#f9e0d7;border-color:#d98a72}
.ib:hover{border-color:var(--i3);background:var(--bg)}
.ovl{position:fixed;inset:0;background:rgba(20,17,13,.5);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;backdrop-filter:blur(3px)}
.mdl{background:#fff;border-radius:var(--r);max-width:540px;width:100%;max-height:86vh;overflow-y:auto;padding:26px;box-shadow:var(--sh2)}
.mdl-sm{max-width:400px}
.arow{display:flex;align-items:center;gap:12px;background:var(--cd);border:1px solid var(--ln);border-radius:var(--r2);padding:14px 16px;margin-bottom:9px}
.arow.past{opacity:.45}
.ord{display:flex;flex-direction:column;gap:2px}
.ord button{width:21px;height:17px;border:1px solid var(--ln);border-radius:4px;font-size:9px;display:flex;align-items:center;justify-content:center;background:#fff}
.ord button:disabled{opacity:.3;cursor:not-allowed}
.ai{flex:1;min-width:0}
.ai .t{font-weight:700;font-size:14px}
.ai .s{font-size:12px;color:var(--i3);margin-top:2px}
.mini{display:inline-block;background:var(--ln2);border-radius:5px;padding:2px 7px;font-size:10.5px;font-weight:700;color:var(--i2);margin-right:4px}
.tg{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-left:5px;vertical-align:middle}
.tg.g{background:var(--ln2);color:var(--i3)}
.tg.w{background:var(--am-w);color:var(--am)}
.ed{background:var(--bg);border:1.5px dashed var(--ln);border-radius:var(--r2);padding:19px;margin:14px 0}
.grp{margin-bottom:24px}
.grp>h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--i3);font-family:var(--fb);font-weight:800;margin-bottom:9px}
.login{max-width:340px;margin:56px auto;text-align:center}
.pin{width:100%;text-align:center;font-size:25px;letter-spacing:.35em;font-family:var(--fd);font-weight:800;padding:14px;border:1.5px solid var(--ln);border-radius:var(--r2);margin:16px 0}
.load{text-align:center;padding:56px 20px;color:var(--i3);font-weight:600}
.nt{font-size:11.5px;color:var(--i3);margin-top:13px;line-height:1.5}
.embed .foot{display:none}
/* Në modalitetin embed (nxënësi vjen nga Wix me deep-link) mbetet një header
   minimal: vetëm logoja (lidhje te faqja kryesore) dhe çelësi i gjuhës. */
.embed .top{border-bottom:1px solid var(--ln);background:#fff}
.embed .top .burger,.embed .top #nH,.embed .top #nL,.embed .top #nA{display:none!important}
.embed .top .nav{display:flex!important;gap:0;position:static;transform:none;box-shadow:none;
  background:transparent;padding:0;border:0;height:auto;width:auto}
.embed .top .tin{padding-top:11px;padding-bottom:11px}
.embed .top .lg{cursor:pointer}
.embed .main{padding:18px 0 40px}

/* ==== modern tiles + einstufungstest banner ==== */
.tile.mod{background:var(--tint,var(--cd));border:none;align-items:flex-start;justify-content:flex-start;
  padding:22px 20px;gap:0;aspect-ratio:auto;min-height:158px}
.tile.mod::after{display:none}
.tile.mod:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.tile.mod .mic{width:48px;height:48px;border-radius:13px;background:var(--iconbg,var(--gr-d));display:flex;
  align-items:center;justify-content:center;flex-shrink:0;border:none;font-size:24px}
.tile.mod .mic svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile.mod .mtxt{margin-top:auto;text-align:left;width:100%}
.tile.mod .mtn{font-family:var(--fd);font-weight:700;font-size:16.5px;color:var(--titc,var(--ink));
  letter-spacing:-.01em;line-height:1.2}
.tile.mod .mts{font-size:12.5px;color:var(--subc,var(--i2));font-weight:600;margin-top:3px;line-height:1.35}
@media(max-width:480px){.tile.mod{min-height:132px;padding:16px 14px}.tile.mod .mic{width:42px;height:42px}
  .tile.mod .mic svg{width:22px;height:22px}.tile.mod .mtn{font-size:14.5px}.tile.mod .mts{font-size:11.5px}}
/* ---- themed sector inner pages (abend / intensiv / telc …) ---- */
.sec-hero{display:flex;align-items:center;gap:16px;background:var(--tint,var(--cd));border-radius:20px;
  padding:22px 24px;margin-bottom:24px}
.sec-hero .mic{width:56px;height:56px;border-radius:15px;background:var(--iconbg,var(--gr-d));display:flex;
  align-items:center;justify-content:center;flex-shrink:0;font-size:26px}
.sec-hero .mic svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sec-hero .sh-txt{text-align:left;min-width:0}
.sec-hero .sh-txt h1{font-family:var(--fd);font-weight:700;font-size:26px;color:var(--titc,var(--ink));
  letter-spacing:-.01em;margin:0;line-height:1.15}
.sec-hero .sh-txt p{font-size:13.5px;color:var(--subc,var(--i2));font-weight:600;margin:5px 0 0;line-height:1.4}
@media(max-width:480px){.sec-hero{padding:18px 18px;gap:13px}.sec-hero .mic{width:48px;height:48px}
  .sec-hero .mic svg{width:24px;height:24px}.sec-hero .sh-txt h1{font-size:21px}}
.tile.lvl{background:var(--tint,var(--cd));border:none;align-items:flex-start;justify-content:flex-start;
  padding:20px 18px;gap:0;aspect-ratio:auto;min-height:150px}
.tile.lvl::after{display:none}
.tile.lvl:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.tile.lvl .lvbadge{min-width:48px;height:48px;padding:0 13px;border-radius:13px;background:var(--iconbg,var(--gr-d));
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:18px;
  color:#fff;letter-spacing:-.02em}
.tile.lvl .lvbadge svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile.lvl .mtxt{margin-top:auto;text-align:left;width:100%}
.tile.lvl .mtn{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--titc,var(--ink));
  letter-spacing:-.01em;line-height:1.2}
.tile.lvl .mts{font-size:12.5px;color:var(--subc,var(--i2));font-weight:600;margin-top:3px;line-height:1.35}
@media(max-width:480px){.tile.lvl{min-height:128px;padding:15px 13px}.tile.lvl .lvbadge{height:42px;min-width:42px;font-size:16px}
  .tile.lvl .lvbadge svg{width:22px;height:22px}.tile.lvl .mtn{font-size:14.5px}.tile.lvl .mts{font-size:11.5px}}
/* ---- Einstufungstest banner ---- */
.estbanner{background:var(--ink);border-radius:16px;padding:24px;display:flex;align-items:center;gap:18px;
  margin-top:14px;cursor:pointer;transition:.18s;position:relative;overflow:hidden;width:100%;text-align:left}
.estbanner:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.estbanner .eic{width:54px;height:54px;border-radius:14px;background:var(--or);display:flex;align-items:center;
  justify-content:center;flex-shrink:0}
.estbanner .eic svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.estbanner .ebody{flex:1;min-width:0}
.estbanner .ebadge{display:inline-block;background:rgba(243,112,39,.22);color:#f5c4b3;font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:99px;margin-bottom:6px}
.estbanner .etit{font-family:var(--fd);font-weight:700;font-size:18px;color:#fff;letter-spacing:-.01em}
.estbanner .esub{font-size:13px;color:#9fe1cb;margin-top:2px}
.estbanner .ecta{background:var(--or);color:#fff;font-size:14px;font-weight:700;padding:11px 20px;border-radius:99px;
  white-space:nowrap;flex-shrink:0}
@media(max-width:560px){.estbanner{flex-wrap:wrap;gap:14px}.estbanner .ecta{width:100%;text-align:center}}
/* ==== einstufungstest scoped styles ==== */
.est-scope{--e-ink:#16241A;--e-soft:#51604F;--e-paper:#fff;--e-mist:#F1F6EF;--e-line:rgba(22,36,26,.13);
  --e-or:#F37027;--e-or-d:#D9600F;--e-gr:#3AAF4A;--e-forest:#1F5E28;--e-rust:#C1443C;
  font-family:'Inter',system-ui,sans-serif;color:var(--e-ink)}
.est-scope h2{font-family:'Bricolage Grotesque',serif;margin:0;font-weight:600;letter-spacing:-.01em}
.est-scope .est-mono{font-family:'IBM Plex Mono','Courier New',monospace;letter-spacing:.02em}
.est-scope [hidden]{display:none!important}
.est-scope .est-stamp{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:2.5px solid currentColor;position:relative;flex:none;transform:rotate(-6deg);
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:1.05rem;letter-spacing:.04em}
.est-scope .est-stamp::before{content:'';position:absolute;inset:6px;border:1px dashed currentColor;border-radius:50%;opacity:.55}
.est-scope .est-stamp.a1{color:var(--e-forest);background:rgba(31,94,40,.06)}
.est-scope .est-stamp.a2{color:var(--e-forest);background:rgba(31,94,40,.13)}
.est-scope .est-stamp.b1{color:var(--e-or-d);background:rgba(243,112,39,.08)}
.est-scope .est-stamp.b2{color:var(--e-or-d);background:rgba(243,112,39,.16)}
.est-scope .est-stamp.done{color:var(--e-gr);background:rgba(58,175,74,.08);font-size:1.5rem}
.est-scope .est-stamp.result{width:112px;height:112px;font-size:1.55rem;margin:0 auto}
.est-scope .est-btn{border:none;border-radius:999px;padding:14px 22px;font-weight:600;font-size:.95rem;cursor:pointer;
  transition:transform .15s,box-shadow .2s,background .2s;font-family:inherit}
.est-scope .est-btn:active{transform:scale(.97)}
.est-scope .est-btn.pri{background:var(--e-or);color:#fff;box-shadow:0 14px 26px -14px rgba(243,112,39,.65)}
.est-scope .est-btn.pri:hover{background:var(--e-or-d)}
.est-scope .est-btn.sec{background:var(--e-mist);color:var(--e-forest)}
.est-scope .est-btn.sec:hover{background:#e5efe3}
.est-scope .est-btn.out{background:transparent;border:1.5px solid var(--e-line);color:var(--e-soft)}
.est-scope .est-btn.out:hover{border-color:var(--e-forest);color:var(--e-forest)}
.est-scope .est-btn.block{width:100%}
.est-scope .est-btn:disabled{opacity:.45;cursor:not-allowed}
.est-scope .est-ghost{background:transparent;border:1px solid var(--e-line);border-radius:999px;padding:9px 16px;
  color:var(--e-soft);font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.est-scope .est-ghost:hover{border-color:var(--e-forest);color:var(--e-forest)}
.est-scope .est-hero{max-width:880px;margin:0 auto;padding:20px 0 8px;text-align:center}
.est-scope .est-eyebrow{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.14em;
  font-size:.72rem;color:var(--e-forest);margin:0 0 14px}
.est-scope .est-hero h1{font-family:'Bricolage Grotesque',serif;font-weight:700;font-size:clamp(1.7rem,5vw,2.8rem);
  line-height:1.1;color:var(--e-ink);letter-spacing:-.02em;margin:0}
.est-scope .est-hero p{font-size:1.02rem;color:var(--e-soft);max-width:560px;margin:16px auto 0;line-height:1.6}
.est-scope .est-lvgrid{max-width:920px;margin:36px auto 0;display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media(max-width:680px){.est-scope .est-lvgrid{grid-template-columns:1fr;margin-top:24px}}
.est-scope .est-lvcard{background:var(--e-paper);border:1px solid var(--e-line);border-radius:20px;padding:24px;
  text-align:left;box-shadow:0 10px 26px -18px rgba(22,36,26,.22);display:flex;flex-direction:column;gap:12px;
  transition:transform .25s,box-shadow .25s}
.est-scope .est-lvcard:hover{transform:translateY(-4px);box-shadow:0 24px 48px -28px rgba(22,36,26,.32)}
.est-scope .est-lvtop{display:flex;align-items:center;gap:14px}
.est-scope .est-lvcard h2{font-size:1.24rem;color:var(--e-ink)}
.est-scope .est-lvdesc{color:var(--e-soft);font-size:.92rem;line-height:1.5;margin:0}
.est-scope .est-lvmeta{font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--e-soft);margin:0}
.est-scope .est-topbar{max-width:760px;margin:0 auto;padding:8px 0 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.est-scope .est-chip{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:.82rem;border:1.5px solid var(--e-forest);
  color:var(--e-forest);border-radius:999px;padding:6px 14px;flex:none}
.est-scope .est-pwrap{flex:1;min-width:180px}
.est-scope .est-ptrack{height:6px;background:var(--e-mist);border-radius:999px;overflow:hidden}
.est-scope .est-pfill{height:100%;background:linear-gradient(90deg,var(--e-forest),var(--e-or));width:0%;transition:width .4s}
.est-scope .est-plabel{display:flex;justify-content:space-between;font-size:.74rem;color:var(--e-soft);margin-top:6px}
.est-scope .est-qcard{max-width:760px;margin:22px auto;background:var(--e-paper);border:1px solid var(--e-line);
  border-radius:20px;padding:30px;box-shadow:0 10px 26px -18px rgba(22,36,26,.22)}
.est-scope .est-qtext{font-family:'Bricolage Grotesque',serif;font-weight:600;font-size:1.3rem;line-height:1.4;margin-bottom:18px;color:var(--e-ink)}
.est-scope .est-passage{background:var(--e-mist);border-left:3px solid var(--e-forest);border-radius:9px;
  padding:16px 18px;font-size:.9rem;line-height:1.6;color:var(--e-soft);margin-bottom:18px}
.est-scope .est-note{background:rgba(243,112,39,.08);border:1px solid rgba(243,112,39,.3);color:var(--e-or-d);
  border-radius:9px;padding:10px 14px;font-size:.84rem;margin-bottom:16px}
.est-scope .est-answers{display:flex;flex-direction:column;gap:10px}
.est-scope .est-ans{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1.5px solid var(--e-line);
  border-radius:14px;background:var(--e-paper);padding:14px 16px;cursor:pointer;font-size:.96rem;color:var(--e-ink);
  transition:border-color .2s,background .2s,transform .1s;font-family:inherit}
.est-scope .est-ans:hover:not(.answered){border-color:var(--e-or);background:rgba(243,112,39,.05)}
.est-scope .est-ans:active:not(.answered){transform:scale(.99)}
.est-scope .est-let{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--e-line);display:flex;
  align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:700;
  color:var(--e-soft);transition:all .2s}
.est-scope .est-ans.selected{border-color:var(--e-or);background:rgba(243,112,39,.06)}
.est-scope .est-ans.selected .est-let{background:var(--e-or);border-color:var(--e-or);color:#fff}
.est-scope .est-ans.correct{border-color:var(--e-gr);background:rgba(58,175,74,.08)}
.est-scope .est-ans.correct .est-let{background:var(--e-gr);border-color:var(--e-gr);color:#fff}
.est-scope .est-ans.incorrect{border-color:var(--e-rust);background:rgba(193,68,60,.06)}
.est-scope .est-ans.incorrect .est-let{background:var(--e-rust);border-color:var(--e-rust);color:#fff}
.est-scope .est-ans.answered{cursor:default}
.est-scope .est-nav{max-width:760px;margin:0 auto 20px;display:flex;justify-content:space-between;gap:12px}
.est-scope .est-nav .est-btn{flex:1;max-width:200px}
.est-scope .est-panel-wrap{display:flex;justify-content:center;padding:20px 0}
.est-scope .est-panel{background:var(--e-paper);border:1px solid var(--e-line);border-radius:20px;
  box-shadow:0 24px 48px -28px rgba(22,36,26,.32);padding:40px 34px;max-width:460px;width:100%;text-align:center}
.est-scope .est-panel h2{font-size:1.5rem;margin:16px 0 8px}
.est-scope .est-panel>p{color:var(--e-soft);font-size:.94rem;line-height:1.5}
.est-scope .est-field{text-align:left;margin-top:16px}
.est-scope .est-field label{display:block;font-size:.8rem;font-weight:600;color:var(--e-soft);margin-bottom:6px}
.est-scope .est-field input{width:100%;padding:12px 14px;border:1.5px solid var(--e-line);border-radius:9px;
  font-size:.95rem;font-family:inherit;transition:border-color .2s}
.est-scope .est-field input:focus{outline:none;border-color:var(--e-or)}
.est-scope .est-err{background:rgba(193,68,60,.08);border:1px solid rgba(193,68,60,.3);color:var(--e-rust);
  border-radius:9px;padding:10px 14px;font-size:.84rem;margin-top:16px;text-align:left}
.est-scope .est-cbwrap{margin-top:16px}
.est-scope .est-cblabel{display:grid;grid-template-columns:18px 1fr;align-items:start;column-gap:10px;cursor:pointer;text-align:left;width:100%}
.est-scope .est-cblabel input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--e-or);cursor:pointer}
.est-scope .est-cbtitle{font-size:.78rem;font-weight:600;color:var(--e-ink)}
.est-scope .est-cbdesc{font-size:.71rem;color:var(--e-soft);line-height:1.4}
.est-scope .est-hint{font-size:.78rem;color:var(--e-soft);margin-top:14px;text-align:center}
.est-scope .est-rlabel{font-weight:600;color:var(--e-ink);margin-top:14px!important}
.est-scope .est-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
.est-scope .est-stats>div{background:var(--e-mist);border-radius:14px;padding:16px}
.est-scope .est-stats span{display:block;font-family:'Bricolage Grotesque',serif;font-size:1.5rem;font-weight:600;color:var(--e-ink)}
.est-scope .est-stats label{font-size:.74rem;color:var(--e-soft)}
.est-scope .est-rdesc{background:var(--e-mist);border-radius:14px;padding:16px;font-size:.9rem;line-height:1.5;color:var(--e-soft);text-align:left}
.est-scope .est-ractions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
@media(max-width:640px){.est-scope .est-qcard{padding:22px}.est-scope .est-qtext{font-size:1.12rem}
  .est-scope .est-nav .est-btn{max-width:none}.est-scope .est-panel{padding:32px 24px}}
</style>

<body>

const SEED_LVD={"A1":{"intro":{"de":"In einem A1 Deutschkurs werden grundlegende Deutschkenntnisse für Anfänger vermittelt. Hier sind die Schritte, die typischerweise in einem A1 Deutschkurs durchlaufen werden:","en":"An A1 German course teaches basic German for complete beginners. These are the steps you will typically go through in an A1 course:"},"items":[{"title":{"de":"Begrüßung und Vorstellung","en":"Greetings and introductions"},"text":{"de":"Zunächst lernen die Teilnehmer, wie man sich auf Deutsch begrüßt und vorstellt. Das beinhaltet das Erlernen von einfachen Begrüßungsformeln wie \"Guten Tag\" oder \"Wie geht es Ihnen?\".","en":"First, participants learn how to greet others and introduce themselves in German. This includes simple phrases such as \"Guten Tag\" or \"Wie geht es Ihnen?\"."}},{"title":{"de":"Alphabet und Aussprache","en":"Alphabet and pronunciation"},"text":{"de":"Die Teilnehmer lernen das deutsche Alphabet und die richtige Aussprache der Buchstaben. Dies ist wichtig, um sich später verständlich ausdrücken zu können.","en":"Participants learn the German alphabet and the correct pronunciation of each letter — essential for making yourself understood later on."}},{"title":{"de":"Zahlen und Uhrzeit","en":"Numbers and telling the time"},"text":{"de":"Die Kursteilnehmer lernen, Zahlen auf Deutsch zu zählen sowie die Uhrzeit zu lesen und zu sagen.","en":"Participants learn to count in German and to read and say the time."}},{"title":{"de":"Grundlegende Grammatik","en":"Basic grammar"},"text":{"de":"Einfache grammatische Strukturen wie die Bildung von Aussagesätzen, Fragen und Verneinungen werden eingeführt. Auch die Grundformen der Verben und einfache Präpositionen können Teil des Unterrichts sein.","en":"Simple structures are introduced: statements, questions and negation. Basic verb forms and simple prepositions are also covered."}},{"title":{"de":"Vokabeln und Alltagswortschatz","en":"Vocabulary for everyday life"},"text":{"de":"In einem A1 Deutschkurs wird auch ein grundlegender Wortschatz vermittelt, der es den Teilnehmern ermöglicht, sich im Alltag zurechtzufinden. Das beinhaltet Wörter für Tiere, Farben, Zahlen, Familie, Berufe, Essen, Trinken usw.","en":"The course builds a core vocabulary that lets you cope with everyday situations: animals, colours, numbers, family, professions, food, drink and more."}},{"title":{"de":"Einfache Konversationen","en":"Simple conversations"},"text":{"de":"Die Teilnehmer üben, einfache Gespräche auf Deutsch zu führen, z.B. sich selbst vorzustellen, über den Beruf zu sprechen, nach dem Weg zu fragen, im Restaurant zu bestellen usw.","en":"Participants practise simple conversations: introducing themselves, talking about their job, asking for directions, ordering in a restaurant and so on."}},{"title":{"de":"Hörverständnis und Leseverständnis","en":"Listening and reading comprehension"},"text":{"de":"Durch Hör- und Leseverständnisübungen werden die Teilnehmer darin geschult, gesprochenes und geschriebenes Deutsch besser zu verstehen.","en":"Listening and reading exercises train participants to better understand spoken and written German."}},{"title":{"de":"Schreiben und Sprechen","en":"Writing and speaking"},"text":{"de":"Die Kursteilnehmer üben auch das Schreiben von kurzen Texten und das Sprechen in einfachen Sätzen, um ihre Kommunikationsfähigkeiten zu verbessern.","en":"Participants also practise writing short texts and speaking in simple sentences to improve their communication skills."}}],"outro":{"de":"Insgesamt zielt ein A1 Deutschkurs darauf ab, den Teilnehmern eine solide Grundlage in der deutschen Sprache zu vermitteln, damit sie sich im Alltag auf einfache Weise verständigen können.","en":"Overall, an A1 course gives you a solid foundation in German so that you can communicate in simple terms in everyday situations."}},"A2":{"intro":{"de":"In einem A2 Deutschkurs können die Lernenden schrittweise verschiedene Aspekte der deutschen Sprache erlernen. Hier ist eine grobe Übersicht über die Themen, die typischerweise in einem A2 Deutschkurs behandelt werden:","en":"An A2 German course builds on the basics step by step. Here is an overview of the topics typically covered at A2 level:"},"items":[{"title":{"de":"Grammatik","en":"Grammar"},"text":{"de":"Verben: Konjugation von regelmäßigen und unregelmäßigen Verben, Modalverben, trennbare und untrennbare Verben. Substantive: Nominativ, Akkusativ, Dativ, Genitiv, Pluralbildung. Adjektive: Steigerung, Deklination. Pronomen: Personalpronomen, Possessivpronomen, Demonstrativpronomen. Satzbau: einfache Sätze, Nebensätze, Fragen.","en":"Verbs: regular and irregular conjugation, modal verbs, separable and inseparable verbs. Nouns: nominative, accusative, dative, genitive, plural forms. Adjectives: comparison and declension. Pronouns: personal, possessive and demonstrative. Sentence structure: main clauses, subordinate clauses, questions."}},{"title":{"de":"Wortschatz","en":"Vocabulary"},"text":{"de":"Alltagsvokabular: Zahlen, Farben, Familie, Berufe, Beschreibungen, Einkaufen, Essen und Trinken, Reisen. Präpositionen und Konjunktionen. Zeitangaben: Uhrzeit, Wochentage, Monate, Jahreszeiten.","en":"Everyday vocabulary: numbers, colours, family, professions, descriptions, shopping, food and drink, travel. Prepositions and conjunctions. Time expressions: clock time, weekdays, months, seasons."}},{"title":{"de":"Hörverständnis","en":"Listening comprehension"},"text":{"de":"Verstehen von alltäglichen Gesprächen, Anweisungen, Informationen zu Routinen, etc.","en":"Understanding everyday conversations, instructions and information about daily routines."}},{"title":{"de":"Leseverständnis","en":"Reading comprehension"},"text":{"de":"Verstehen von einfachen Texten zu verschiedenen Themen.","en":"Understanding simple texts on a range of topics."}},{"title":{"de":"Sprechen","en":"Speaking"},"text":{"de":"Einfache Konversationen führen: sich vorstellen, über Hobbys und Interessen sprechen, den Weg beschreiben, über Vergangenes erzählen. Rollenspiele und Dialoge.","en":"Holding simple conversations: introducing yourself, talking about hobbies and interests, giving directions, talking about the past. Role plays and dialogues."}},{"title":{"de":"Schreiben","en":"Writing"},"text":{"de":"Kurze Texte verfassen: E-Mails, Postkarten, Beschreibungen von Personen oder Orten.","en":"Writing short texts: emails, postcards, descriptions of people or places."}},{"title":{"de":"Kulturelle Themen","en":"Cultural topics"},"text":{"de":"Landeskunde: Deutschland und deutschsprachige Länder. Bräuche, Traditionen, Feiertage.","en":"Country studies: Germany and the German-speaking countries. Customs, traditions and public holidays."}}],"outro":{"de":"Es ist wichtig, regelmäßig zu üben, Vokabeln zu wiederholen und die Grammatikregeln zu festigen, um Fortschritte zu machen. Ein gut strukturierter A2 Deutschkurs sollte die Lernenden dabei unterstützen, ihre Deutschkenntnisse schrittweise zu verbessern.","en":"Regular practice, vocabulary revision and consolidating grammar rules are key to making progress. A well-structured A2 course supports learners in improving their German step by step."}},"B1":{"intro":{"de":"In einem B1 Deutschkurs können Lernende eine Vielzahl von Themen und Fähigkeiten auf dem Weg zum Spracherwerb auf fortgeschrittenem Niveau erlernen. Hier sind einige Schritte, die typischerweise in einem B1 Deutschkurs abgedeckt werden:","en":"A B1 German course covers a wide range of topics and skills on the way to an advanced command of the language. These are the areas typically covered at B1 level:"},"items":[{"title":{"de":"Wortschatz und Grammatik","en":"Vocabulary and grammar"},"text":{"de":"Lernende erweitern ihren Wortschatz und lernen komplexere Grammatikstrukturen, um sich klarer ausdrücken zu können.","en":"Learners expand their vocabulary and study more complex grammar structures in order to express themselves more clearly."}},{"title":{"de":"Leseverständnis","en":"Reading comprehension"},"text":{"de":"Lernende üben das Lesen von Texten in deutscher Sprache, um den Inhalt zu verstehen und Informationen daraus zu extrahieren.","en":"Learners practise reading German texts in order to understand the content and extract information from it."}},{"title":{"de":"Hörverständnis","en":"Listening comprehension"},"text":{"de":"Lernende trainieren ihr Hörverständnis, indem sie Dialoge, Interviews, Nachrichten oder andere gesprochene Inhalte auf Deutsch hören und verstehen.","en":"Learners train their listening skills with dialogues, interviews, news and other spoken material in German."}},{"title":{"de":"Schriftlicher Ausdruck","en":"Written expression"},"text":{"de":"Lernende üben das Verfassen von Texten wie Briefen, E-Mails oder kurzen Aufsätzen, um ihre schriftlichen Fähigkeiten zu verbessern.","en":"Learners practise writing letters, emails and short essays to improve their writing skills."}},{"title":{"de":"Mündlicher Ausdruck","en":"Spoken expression"},"text":{"de":"Lernende üben das Sprechen in verschiedenen Situationen, z. B. Diskussionen, Präsentationen oder Rollenspielen, um fließender und selbstbewusster zu sprechen.","en":"Learners practise speaking in different situations — discussions, presentations and role plays — to speak more fluently and confidently."}},{"title":{"de":"Kulturelles Verständnis","en":"Cultural understanding"},"text":{"de":"Lernende lernen auch über die deutsche Kultur, Traditionen und Bräuche, um ein besseres Verständnis für das Land und seine Bewohner zu entwickeln.","en":"Learners also study German culture, traditions and customs to develop a better understanding of the country and its people."}}],"outro":{"de":"Jeder Deutschkurs kann je nach Lehrplan und Lehrmethode variieren, aber diese Schritte bieten eine allgemeine Vorstellung davon, was Lernende in einem B1 Deutschkurs erwarten können.","en":"Every course varies according to its syllabus and teaching method, but these areas give a general idea of what to expect from a B1 German course."}},"B2":{"intro":{"de":"In einem B2 Deutschkurs kann man schrittweise verschiedene Fähigkeiten und Themen lernen, um seine Deutschkenntnisse auf fortgeschrittenem Niveau zu verbessern. Hier sind einige Schritte, die typischerweise in einem B2 Deutschkurs behandelt werden:","en":"A B2 German course develops your skills step by step towards an advanced command of the language. These are the areas typically covered at B2 level:"},"items":[{"title":{"de":"Grammatik","en":"Grammar"},"text":{"de":"Vertiefung und Erweiterung der Grammatikkenntnisse, einschließlich komplexerer grammatischer Strukturen, Zeitformen und Satzkonstruktionen.","en":"Deepening and extending your grammar, including more complex structures, tenses and sentence constructions."}},{"title":{"de":"Wortschatz","en":"Vocabulary"},"text":{"de":"Erweiterung des Wortschatzes durch das Lernen von neuen Vokabeln und Redewendungen zu verschiedenen Themenbereichen.","en":"Expanding your vocabulary with new words and idiomatic expressions across a range of subject areas."}},{"title":{"de":"Leseverständnis","en":"Reading comprehension"},"text":{"de":"Übungen und Aktivitäten, um das Verständnis von komplexeren Texten zu verbessern, einschließlich von Zeitungsartikeln, Kurzgeschichten oder Fachtexten.","en":"Exercises to improve your understanding of more complex texts, including newspaper articles, short stories and specialist texts."}},{"title":{"de":"Hörverständnis","en":"Listening comprehension"},"text":{"de":"Übungen zum Verbessern des Hörverständnisses durch das Anhören von Dialogen, Interviews, Nachrichten oder Podcasts.","en":"Exercises to improve listening skills through dialogues, interviews, news broadcasts and podcasts."}},{"title":{"de":"Schreibfertigkeiten","en":"Writing skills"},"text":{"de":"Praktische Übungen zum Verfassen von Texten wie Berichten, Briefen, Aufsätzen oder E-Mails, um die schriftliche Ausdrucksfähigkeit zu verbessern.","en":"Practical exercises in writing reports, letters, essays and emails to improve written expression."}},{"title":{"de":"Sprechen","en":"Speaking"},"text":{"de":"Mündliche Übungen zur Verbesserung der Kommunikationsfähigkeiten, einschließlich Diskussionen, Präsentationen, Debatten oder Rollenspielen.","en":"Speaking exercises to improve communication skills, including discussions, presentations, debates and role plays."}},{"title":{"de":"Prüfungsvorbereitung","en":"Exam preparation"},"text":{"de":"Vorbereitung auf die B2-Prüfung, um die Sprachkenntnisse zu testen und gezielt auf die Anforderungen der Prüfung vorzubereiten.","en":"Preparation for the B2 examination, testing your language skills and targeting the specific requirements of the exam."}}],"outro":{"de":"Diese Schritte sind nur ein allgemeiner Leitfaden und können je nach Kurs und Lehrplan variieren. Es ist wichtig, regelmäßig zu üben, den Unterricht aufmerksam zu verfolgen und sich aktiv an den Übungen zu beteiligen, um die Deutschkenntnisse erfolgreich auf B2-Niveau zu verbessern.","en":"These areas are a general guide and may vary from course to course. Regular practice, attentive participation and active involvement in the exercises are key to reaching B2 level successfully."}},"C1":{"intro":{"de":"In einem C1 Deutschkurs werden fortgeschrittene Deutschkenntnisse vermittelt, die es ermöglichen, die Sprache auf einem fast muttersprachlichen Niveau zu beherrschen. Hier sind einige Schritte, die typischerweise in einem C1 Deutschkurs abgedeckt werden können:","en":"A C1 German course develops advanced skills that allow you to use the language at a near-native level. These are the areas typically covered at C1:"},"items":[{"title":{"de":"Wortschatz und Grammatik","en":"Vocabulary and grammar"},"text":{"de":"In einem C1 Kurs werden Sie Ihren Wortschatz erweitern und komplexere grammatische Strukturen erlernen. Dazu gehören zum Beispiel der Konjunktiv II, der Konjunktiv I, die indirekte Rede, Passivkonstruktionen und komplexe Satzstrukturen.","en":"You expand your vocabulary and master more complex grammar: Konjunktiv I and II, reported speech, passive constructions and complex sentence structures."}},{"title":{"de":"Leseverständnis","en":"Reading comprehension"},"text":{"de":"Sie werden anspruchsvolle Texte wie literarische Werke, Zeitungsartikel, wissenschaftliche Texte usw. lesen und verstehen lernen. Dabei wird auch darauf eingegangen, wie man Texte analysiert, Schlussfolgerungen zieht und Argumente versteht.","en":"You read and understand demanding texts — literary works, newspaper articles, academic writing — and learn to analyse them, draw conclusions and follow lines of argument."}},{"title":{"de":"Hörverständnis","en":"Listening comprehension"},"text":{"de":"Sie werden sich mit verschiedenen gesprochenen Texten auseinandersetzen, wie z.B. Nachrichtensendungen, Podcasts, Interviews usw. Dabei trainieren Sie Ihr Hörverständnis und lernen, komplexere Inhalte zu erfassen.","en":"You work with a variety of spoken material — news broadcasts, podcasts, interviews — training your listening skills and learning to grasp more complex content."}},{"title":{"de":"Sprechen","en":"Speaking"},"text":{"de":"In einem C1 Kurs werden Sie lernen, fließend und überzeugend zu sprechen. Dazu gehören Diskussionen zu verschiedenen Themen, Präsentationen, Debatten und freies Sprechen. Sie werden auch lernen, Ihre Meinung zu äußern, Argumente zu präsentieren und auf komplexe Fragen zu antworten.","en":"You learn to speak fluently and persuasively: discussions, presentations, debates and free speaking. You practise stating opinions, presenting arguments and responding to complex questions."}},{"title":{"de":"Schreiben","en":"Writing"},"text":{"de":"Sie werden lernen, komplexe schriftliche Texte zu verfassen, wie z.B. Essays, Berichte, Analysen usw. Dabei werden Sie Ihre Schreibfertigkeiten weiterentwickeln und lernen, strukturiert und überzeugend zu schreiben.","en":"You learn to write complex texts such as essays, reports and analyses, developing a structured and persuasive writing style."}},{"title":{"de":"Kulturelles Verständnis","en":"Cultural understanding"},"text":{"de":"In einem C1 Kurs werden auch kulturelle Aspekte der deutschen Sprache und Gesellschaft behandelt. Sie werden mehr über die deutsche Kultur, Geschichte, Politik und aktuelle Ereignisse erfahren.","en":"The course also covers cultural aspects of German language and society: culture, history, politics and current affairs."}}],"outro":{"de":"Insgesamt zielt ein C1 Deutschkurs darauf ab, Ihre Deutschkenntnisse auf ein sehr hohes Niveau zu bringen, sodass Sie die Sprache in verschiedenen Situationen souverän und selbstbewusst nutzen können.","en":"Overall, a C1 course brings your German to a very high level so that you can use the language confidently and assuredly in a wide range of situations."}},"C2":{"intro":{"de":"**C2 Deutschkurs – Sprachkompetenz auf höchstem Niveau**\nEin C2-Deutschkurs richtet sich an Lernende, die ihre Sprachkenntnisse auf ein nahezu muttersprachliches Niveau weiterentwickeln möchten. Ziel ist es, die deutsche Sprache in allen Lebens-, Studien- und Berufskontexten präzise, differenziert und stilistisch sicher anzuwenden. Der Unterricht orientiert sich am Gemeinsamen Europäischen Referenzrahmen (GER) und bereitet auf die sprachlichen Anforderungen in Wissenschaft, Beruf und anspruchsvoller Kommunikation vor.","en":"**C2 German course – language competence at the highest level**\nA C2 course is for learners who want to develop their German to a near-native level. The aim is to use the language precisely, subtly and with stylistic confidence in every personal, academic and professional context. Teaching follows the Common European Framework of Reference (CEFR) and prepares you for the linguistic demands of academia, work and sophisticated communication."},"items":[{"title":{"de":"Erweiterter Wortschatz und stilistische Präzision","en":"Extended vocabulary and stylistic precision"},"text":{"de":"Im C2-Kurs wird der aktive und passive Wortschatz gezielt ausgebaut. Der Schwerpunkt liegt auf idiomatischen Wendungen, Redewendungen, fachsprachlichen Begriffen sowie stilistischen Feinheiten. Die Teilnehmenden lernen, sprachliche Register bewusst einzusetzen und ihre Ausdrucksweise situations- und adressatengerecht zu variieren.","en":"Active and passive vocabulary are built up systematically, with a focus on idiomatic expressions, specialist terminology and stylistic nuance. Participants learn to use registers deliberately and to adapt their expression to the situation and audience."}},{"title":{"de":"Grammatische Perfektion","en":"Grammatical mastery"},"text":{"de":"Auf C2-Niveau werden komplexe grammatische Strukturen nicht mehr nur verstanden, sondern sicher und flexibel angewendet. Dazu gehören unter anderem anspruchsvolle Satzkonstruktionen, Nominalisierungen, stilistische Varianten, differenzierte Konjunktivformen, komplexe Passivstrukturen sowie grammatische Feinheiten, die einen präzisen und eleganten Sprachgebrauch ermöglichen.","en":"At C2 level complex structures are not merely understood but applied confidently and flexibly: demanding sentence constructions, nominalisation, stylistic variants, subtle subjunctive forms, complex passive structures and the fine points that make for precise, elegant German."}},{"title":{"de":"Anspruchsvolles Leseverständnis","en":"Advanced reading comprehension"},"text":{"de":"Die Teilnehmenden analysieren und interpretieren komplexe Texte aus Literatur, Wissenschaft, Politik, Wirtschaft und Medien. Sie lernen, implizite Aussagen, rhetorische Mittel, Argumentationsstrukturen und unterschiedliche Schreibstile sicher zu erkennen sowie Texte kritisch zu bewerten und einzuordnen.","en":"Participants analyse and interpret complex texts from literature, academia, politics, business and the media, learning to recognise implicit meaning, rhetorical devices, argumentative structures and different writing styles, and to evaluate texts critically."}},{"title":{"de":"Differenziertes Hörverständnis","en":"Nuanced listening comprehension"},"text":{"de":"Im Hörverstehen werden authentische und anspruchsvolle Audio- und Videobeiträge behandelt, darunter Vorträge, wissenschaftliche Diskussionen, Interviews, Podcasts, Dokumentationen sowie Medienbeiträge mit unterschiedlichen Dialekten und Sprechgeschwindigkeiten. Ziel ist es, auch feine Bedeutungsnuancen, Ironie und implizite Aussagen zuverlässig zu erfassen.","en":"Listening work uses authentic, demanding audio and video: lectures, academic discussions, interviews, podcasts, documentaries and media featuring different dialects and speaking speeds. The aim is to grasp fine nuances, irony and implicit meaning reliably."}},{"title":{"de":"Souveräne mündliche Kommunikation","en":"Confident spoken communication"},"text":{"de":"Der Kurs fördert eine flüssige, spontane und überzeugende Ausdrucksweise. Die Teilnehmenden führen komplexe Diskussionen, moderieren Gespräche, präsentieren anspruchsvolle Themen und vertreten ihre Position differenziert und argumentativ fundiert. Besonderer Wert wird auf rhetorische Fähigkeiten, Präzision sowie einen situationsgerechten Sprachstil gelegt.","en":"The course develops fluent, spontaneous and persuasive expression. Participants lead complex discussions, moderate conversations, present demanding topics and defend their position with nuance and sound argument. Particular attention is paid to rhetorical skill, precision and situationally appropriate style."}},{"title":{"de":"Wissenschaftliches und professionelles Schreiben","en":"Academic and professional writing"},"text":{"de":"Auf C2-Niveau werden umfangreiche und anspruchsvolle Texte verfasst, beispielsweise wissenschaftliche Arbeiten, Fachartikel, Analysen, Stellungnahmen, Gutachten oder Essays. Dabei stehen eine klare Argumentationsstruktur, sprachliche Präzision, stilistische Vielfalt und ein hohes Maß an Kohärenz im Mittelpunkt.","en":"At C2 level you write extensive, demanding texts: academic papers, specialist articles, analyses, position papers, expert reports and essays — with a clear argumentative structure, linguistic precision, stylistic range and a high degree of coherence."}},{"title":{"de":"Interkulturelle und gesellschaftliche Kompetenz","en":"Intercultural and social competence"},"text":{"de":"Ein weiterer Schwerpunkt liegt auf der vertieften Auseinandersetzung mit der deutschsprachigen Kultur, Geschichte, Politik, Wirtschaft und Gesellschaft. Aktuelle gesellschaftliche Entwicklungen sowie interkulturelle Fragestellungen werden kritisch reflektiert und diskutiert, um die kommunikative Handlungskompetenz in unterschiedlichen kulturellen Kontexten zu stärken.","en":"A further focus is an in-depth engagement with German-speaking culture, history, politics, economy and society. Current social developments and intercultural questions are reflected on critically to strengthen communicative competence across cultural contexts."}}],"outro":{"de":"**Ziel des C2-Kurses**\nDer C2-Deutschkurs befähigt die Teilnehmenden, die deutsche Sprache nahezu auf muttersprachlichem Niveau zu beherrschen. Sie können selbst hochkomplexe Texte mühelos verstehen, Informationen aus unterschiedlichen Quellen zusammenführen sowie sich schriftlich und mündlich präzise, differenziert und stilistisch angemessen ausdrücken. Damit erwerben sie die sprachlichen Voraussetzungen für anspruchsvolle akademische Studiengänge, Führungspositionen, internationale Unternehmen sowie Tätigkeiten, die höchste kommunikative Kompetenz erfordern.","en":"**Aim of the C2 course**\nThe C2 course enables participants to command German at a near-native level. They can understand even highly complex texts with ease, synthesise information from different sources and express themselves precisely, subtly and appropriately in both writing and speech. This provides the linguistic basis for demanding degree programmes, leadership positions, international companies and any role requiring the highest communicative competence."}},"telc:A1":{"intro":{"de":"**Über telc A1 Prüfung**\nDie angesehene Sprachschule Lingowelt fungiert als zertifiziertes telc-Prüfungszentrum und organisiert in regelmäßigen Zeitabständen die Sprachprüfung telc Deutsch A1. Interessierte können sich innerhalb der festgelegten Anmeldefristen über die Sprachschule Lingowelt für diese Prüfung registrieren. Des Weiteren werden von der Sprachschule Lingowelt A1-Intensivkurse sowie A1-Abendkurse angeboten, die auf die telc Deutsch A1 Prüfung vorbereiten sollen.","en":"**About the telc A1 exam**\nLingowelt Language School is a certified telc examination centre and holds the telc Deutsch A1 exam at regular intervals. Candidates can register for the exam through Lingowelt within the published registration deadlines. Lingowelt also offers A1 intensive and A1 evening courses designed to prepare you for the telc Deutsch A1 exam."},"items":[],"outro":{"de":"","en":""}},"telc:A2":{"intro":{"de":"**Über telc A2 Prüfung**\nDie telc A2 Prüfung ist eine international anerkannte telc-Sprachprüfung. Das telc A2 Zertifikat wird sowohl in Deutschland als auch von vielen öffentlichen Einrichtungen im Ausland anerkannt. Es bestätigt, dass der Prüfling über elementare Sprachkenntnisse verfügt. Viele Arbeitgeber legen Wert auf Bewerber mit einem telc Zertifikat. Zudem erleichtert es die Integration in ein neues Land.","en":"**About the telc A2 exam**\nThe telc A2 exam is an internationally recognised telc language examination. The telc A2 certificate is recognised in Germany and by many public institutions abroad. It confirms that the candidate has elementary language skills. Many employers value applicants holding a telc certificate, and it also makes integration into a new country easier."},"items":[],"outro":{"de":"","en":""}},"telc:B1":{"intro":{"de":"**Über telc B1 Prüfung**\nDie telc B1 Prüfung besteht aus den vier Teilen Hören, Lesen, Schreiben und Sprechen. Alle Prüfungsteile müssen bestanden werden, um das Zertifikat zu erhalten. Das telc B1 Zertifikat bestätigt, dass man über fortgeschrittene Sprachkenntnisse verfügt. Viele Arbeitgeber und Universitäten erkennen das Zertifikat als Nachweis für Deutschkenntnisse an. Es ist daher eine gute Möglichkeit, seine Sprachkenntnisse offiziell zu dokumentieren.","en":"**About the telc B1 exam**\nThe telc B1 exam consists of four parts: listening, reading, writing and speaking. All parts must be passed in order to receive the certificate. The telc B1 certificate confirms an advanced command of the language. Many employers and universities accept it as proof of German proficiency, making it a good way to document your language skills officially."},"items":[],"outro":{"de":"","en":""}},"telc:B2":{"intro":{"de":"**Über telc B2 Prüfung**\nDie telc B2 Prüfung umfasst verschiedene Aufgabenbereiche, wie zum Beispiel Leseverstehen, Hörverstehen und schriftliche Produktion. Es ist wichtig, sich gründlich auf die Prüfung vorzubereiten, um gute Ergebnisse zu erzielen. Viele Menschen nutzen die telc B2 Prüfung, um ihre Sprachkenntnisse offiziell nachzuweisen. Nach erfolgreichem Bestehen der Prüfung erhalten die Teilnehmer ein Zertifikat, das ihnen Türen für Studium und Beruf öffnen kann.","en":"**About the telc B2 exam**\nThe telc B2 exam covers several areas, including reading comprehension, listening comprehension and written production. Thorough preparation is important in order to achieve good results. Many people take the telc B2 exam to provide official proof of their language skills. On passing, candidates receive a certificate that can open doors in study and work."},"items":[],"outro":{"de":"","en":""}},"telc:C1":{"intro":{"de":"**Über telc C1 Prüfung**\nDie telc C1 Allgemein Prüfung besteht aus verschiedenen Aufgaben, die das Hörverstehen, Leseverstehen, Schreiben und Sprechen testen. Es ist wichtig, sich gründlich auf die Prüfung vorzubereiten, um gute Ergebnisse zu erzielen. Viele Menschen absolvieren die telc C1 Prüfung, um ihre Deutschkenntnisse für den Beruf oder das Studium nachzuweisen. Nach erfolgreichem Bestehen der Prüfung erhalten die Teilnehmer ein Zertifikat, das ihre Sprachkompetenz auf dem Niveau C1 bescheinigt.","en":"**About the telc C1 exam**\nThe telc C1 General exam consists of tasks testing listening, reading, writing and speaking. Thorough preparation is important in order to achieve good results. Many people take the telc C1 exam to prove their German for work or study. On passing, candidates receive a certificate confirming language competence at C1 level."},"items":[],"outro":{"de":"","en":""}},"telc:C1 Hochschule":{"intro":{"de":"**Über telc C1 Hochschule Prüfung**\nDie telc C1 Hochschule Prüfung ist eine international anerkannte Sprachprüfung für den Hochschulzugang. Alle deutschen Hochschulen erkennen die Prüfung telc Deutsch C1 Hochschule an. Das Zertifikat telc C1 Hochschule gilt also neben der DSH-Prüfung und dem TestDaF als Nachweis für die Studienaufnahme. Es wird empfohlen, sich frühzeitig auf die telc C1 Hochschule Prüfung vorzubereiten, um gute Ergebnisse zu erzielen. Viele Studierende nutzen auch Sprachkurse, um sich gezielt auf die Prüfung vorzubereiten und ihre Sprachkenntnisse zu verbessern.","en":"**About the telc C1 Hochschule exam**\nThe telc C1 Hochschule exam is an internationally recognised language examination for university admission. It is accepted by all German universities and, alongside the DSH exam and TestDaF, serves as proof of language proficiency for starting a degree. Early preparation is recommended in order to achieve good results, and many students take dedicated preparation courses to improve their skills."},"items":[],"outro":{"de":"","en":""}},"prep":{"intro":{"de":"**Was Sie im Vorbereitungskurs lernen**\nEin gut strukturierter Vorbereitungskurs deckt alle wichtigen Aspekte ab.","en":"**What you learn in the preparation course**\nA well-structured preparation course covers every important aspect."},"items":[{"title":{"de":"Prüfungsstoff","en":"Exam content"},"text":{"de":"Der Kurs hilft den Teilnehmern dabei, den prüfungsrelevanten Stoff zu wiederholen und zu festigen.","en":"The course helps participants revise and consolidate the material relevant to the exam."}},{"title":{"de":"Strategien","en":"Strategies"},"text":{"de":"Es werden Techniken und Strategien vermittelt, um mit Prüfungsstress umzugehen, effektiv zu lernen und sich optimal auf die Prüfungssituation vorzubereiten.","en":"You learn techniques and strategies for coping with exam stress, studying effectively and preparing optimally for the exam situation."}},{"title":{"de":"Praxisübungen","en":"Practice exercises"},"text":{"de":"Die Teilnehmer bearbeiten prüfungsähnliche Aufgaben und Übungen, um ihr Wissen zu testen und zu vertiefen.","en":"Participants work through exam-style tasks and exercises to test and deepen their knowledge."}},{"title":{"de":"Zeitmanagement","en":"Time management"},"text":{"de":"Es wird gezeigt, wie man die zur Verfügung stehende Zeit während der Prüfung effizient nutzen kann, um alle Aufgaben zu bewältigen.","en":"You learn how to use the available exam time efficiently so as to complete every task."}},{"title":{"de":"Feedback","en":"Feedback"},"text":{"de":"Durch Feedback von Dozenten oder Mitstudierenden können Teilnehmer ihre Stärken und Schwächen identifizieren und gezielt an ihren Defiziten arbeiten.","en":"Feedback from teachers and fellow students helps participants identify their strengths and weaknesses and work specifically on their gaps."}},{"title":{"de":"Selbstbewusstsein","en":"Confidence"},"text":{"de":"Der Prüfungsvorbereitungskurs soll den Teilnehmern helfen, selbstbewusst und gut vorbereitet in die Prüfung zu gehen und ihre Erfolgschancen zu maximieren.","en":"The course helps participants go into the exam confident and well prepared, maximising their chances of success."}}],"outro":{"de":"","en":""}}};
const LVD_LEVELS=['A1','A2','B1','B2','C1','C2'];
/* Çelësi i përshkrimit për gjendjen aktuale të rezervimit. */
function lvdKey(cat,lv){
  const c=String(cat||'');
  const l=String(lv||'').trim();
  if(c==='telc')return l?('telc:'+l):'';
  if(c==='vorb')return 'prep';
  if(c==='reise')return 'reise';
  return l.toUpperCase();          // abend / intensiv / sprachen → A1…C2
}
function lvdGet(key){
  const src=(S.lvdesc&&typeof S.lvdesc==='object')?S.lvdesc:SEED_LVD;
  return src[key]||null;
}
const lvdTxt=o=>!o?'':(typeof o==='string'?o:(o[S.lang]||o.de||o.en||''));
/* Tekst i sigurt → HTML: **bold** dhe rreshta të rinj. */
function lvdHTML(txt){
  if(!txt||!String(txt).trim())return '';
  return esc(String(txt))
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\r?\n/g,'<br>');
}
/* Blloku nën kartën e majtë: hyrja gjithmonë, pjesa tjetër pas "Mehr lesen". */
function lvDescBlock(cat,lv){
  const d=lvdGet(lvdKey(cat,lv));
  if(!d)return '';
  const intro=lvdTxt(d.intro), outro=lvdTxt(d.outro);
  const items=(Array.isArray(d.items)?d.items:[]).filter(x=>lvdTxt(x&&x.title)||lvdTxt(x&&x.text));
  if(!intro&&!items.length&&!outro)return '';
  const more=items.length||outro;
  const open=!!S.lvdOpen;
  return `<div class="lvdesc">
    ${intro?`<div class="lvd-intro">${lvdHTML(intro)}</div>`:''}
    ${more?`<div class="lvd-body ${open?'on':''}">
      ${items.map((x,i)=>`<div class="lvd-item">
        <div class="lvd-t">${i+1}. ${lvdHTML(lvdTxt(x.title))}</div>
        <div class="lvd-x">${lvdHTML(lvdTxt(x.text))}</div>
      </div>`).join('')}
      ${outro?`<div class="lvd-outro">${lvdHTML(outro)}</div>`:''}
    </div>
    <button class="lvd-more" onclick="S.lvdOpen=!S.lvdOpen;render()">${esc(open?t('lvdLess'):t('lvdMore'))}</button>`:''}
  </div>`;
}

/* ══════════ SPRACHREISEN ══════════
   Tri paketa me strehim + ushqim të plotë. Çmimet janë për javë dhe
   redaktohen nga paneli (Einstellungen → Preise). Individuali llogaritet
   sipas orëve: nxënësi zgjedh 10/20/30 UE në javë.

/* Weekday labels for the optional `days` field (0=So … 6=Sa).
   Courses synced from the Arbeitsplan carry e.g. days:[2,4,6] (Di·Do·Sa).
   Courses without `days` fall back to the fixed DAYS[ct] model, so
   existing cohorts render exactly as before. */
const DOW_LBL={
  de:['So','Mo','Di','Mi','Do','Fr','Sa'],
  en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
};
function courseDays(course,ctype){
  const d=course&&Array.isArray(course.days)?course.days:null;
  if(d&&d.length){
    const arr=[...d].sort((a,b)=>a-b);
    return {de:arr.map(n=>DOW_LBL.de[n]).join(' · '),
            en:arr.map(n=>DOW_LBL.en[n]).join(' · ')};
  }
  return DAYS[(course&&course.ct)||ctype||'abend']||DAYS.abend;
}

/* Multi-user auth: each staff member logs in with their own email +
   password. Role is read from the staff record; a missing role defaults
   to 'admin' so the original single account is never locked out. */
let _pbToken=null,_pbRecId=null,_pbEmail=null,_pbRole=null;

function normRole(r){return (r==='staff'||r==='viewer'||r==='admin')?r:'admin';}

async function pbLogin(email,password){
  try{
    const r=await fetch(`${PB_URL}/api/collections/staff/auth-with-password`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({identity:email,password})
    });
    if(!r.ok)return false;
    const j=await r.json();
    _pbToken=j.token;_pbRecId=j.record&&j.record.id;
    _pbEmail=(j.record&&(j.record.email||j.record.username))||email;
    _pbRole=normRole(j.record&&j.record.role);
    try{localStorage.setItem('lb_pbtok',_pbToken);if(_pbRecId)localStorage.setItem('lb_pbrec',_pbRecId);
        localStorage.setItem('lb_pbmail',_pbEmail||'');localStorage.setItem('lb_pbrole',_pbRole);}catch(e){}
    return true;
  }catch(e){return false;}
}

];
/* Effective permissions: admin always full; others use override or default. */
function permsFor(rl){
  if(rl==='admin')return ROLE_PERMS_DEFAULT.admin;
  const base=ROLE_PERMS_DEFAULT[rl]||ROLE_PERMS_DEFAULT.viewer;
  const ov=(S.rolePerms&&S.rolePerms[rl])||null;

}

async function _pbFind(key){
  try{
    const r=await fetch(`${PB_URL}/api/collections/lingobook/records?filter=(key='${encodeURIComponent(key)}')&k=${encodeURIComponent(key)}&perPage=1`,{headers:authHead()});
    if(!r.ok)return null;
    const j=await r.json();
    const it=(j.items&&j.items[0])||null;
    if(it)_pbKeyMap[key]=it.id;
    return it;
  }catch(e){return null;}
}

// get(key) → gespeicherter Wert (oder null)
async function gt(k,sh){
  try{
    const it=await _pbFind(k);
    return it?it.value:null;
  }catch(e){return null;}
}

// set(key,value,shared,extra) → Upsert (PATCH wenn vorhanden, sonst POST)
// extra: zusätzliche Top-Level-Felder (z.B. {email:'...'}) für gezielte öffentliche Suche
async function pt(k,v,sh,extra){
  try{
    let id=_pbKeyMap[k];
    if(!id){const it=await _pbFind(k);id=it?it.id:null;}
    const body=JSON.stringify(Object.assign({key:k,value:v,shared:sh!==false},extra||{}));
    if(id){
      const r=await fetch(`${PB_URL}/api/collections/lingobook/records/${id}?k=${encodeURIComponent(k)}`,{method:'PATCH',headers:{'Content-Type':'application/json',...authHead()},body});
      return r.ok;
    }else{
      const r=await fetch(`${PB_URL}/api/collections/lingobook/records`,{method:'POST',headers:{'Content-Type':'application/json',...authHead()},body});
      if(r.ok){const c=await r.json();_pbKeyMap[k]=c.id;}
      return r.ok;
    }
  }catch(e){return false;}
}

// list(prefix) → { keys:[...] }  (kompatibel mit window.storage.list)
async function storageList(prefix){
  const keys=[];
  try{
    let page=1;const per=500;
    for(;;){
      const r=await fetch(`${PB_URL}/api/collections/lingobook/records?filter=(key~'${encodeURIComponent(prefix)}')&perPage=${per}&page=${page}&fields=id,key,value,created`,{headers:authHead()});
      if(!r.ok)break;
      const j=await r.json();
      (j.items||[]).forEach(it=>{keys.push(it.key);_pbKeyMap[it.key]=it.id;_pbCache[it.key]=it.value;if(it.created)_pbCreated[it.key]=it.created;});
      const total=j.totalPages||1;
      if(page>=total||!(j.items&&j.items.length))break;
      page++;
      if(page>50)break; // safety cap (25k records)
    }
    return {keys};
  }catch(e){return {keys};}
}
let _fieldsMigrated=false;  // u shtuan fusha të reja nga kodi te cfg-f3
const _pbCache={};  // Zwischenspeicher der Werte aus dem letzten list()
const _pbCreated={};  // PocketBase 'created' Zeitstempel je key (echte Reihenfolge)

// delete(key)
async function storageDelete(key){
  try{
    let id=_pbKeyMap[key];
    if(!id){const it=await _pbFind(key);id=it?it.id:null;}
    if(id){await fetch(`${PB_URL}/api/collections/lingobook/records/${id}`,{method:'DELETE',headers:authHead()});}
    return true;
  }catch(e){return false;}
}

/* Each activity is one shared record keyed alog:<sortable-ts>-<rand>.
   who = logged-in staff id; type drives the icon/colour; msg is bilingual. */
function _actWho(){ return (_pbToken? (_pbEmail||'staff') : 'system'); }
async function logAct(type,msg,ref,extra){
  try{
    const ts=Date.now();
    const key='alog:'+ts.toString().padStart(16,'0')+'-'+Math.random().toString(36).slice(2,6);
    const rec=Object.assign({t:type,msg:msg,who:_actWho(),at:new Date().toISOString(),ref:ref||null},extra||{});
    await pt(key,rec,true);
    if(!S.acts)S.acts=[];
    S.acts.unshift(Object.assign({key},rec));
  }catch(e){/* logging must never break the main action */}
}
async function loadActs(){
  try{
    const res=await storageList('alog:');            // returns {keys:[...]}, fills _pbCache
    const keys=(res&&res.keys)?res.keys:[];
    const arr=keys.map(k=>{
      let v=_pbCache[k];
      if(typeof v==='string')v=safeJ(v);
      return Object.assign({key:k},v||{});
    });
    arr.sort((a,b)=>(b.key||'').localeCompare(a.key||'')); // newest first
    S.acts=arr;
  }catch(e){S.acts=[];}
}
function safeJ(s){try{return JSON.parse(s);}catch(e){return null;}}
/* Unread badge: compare newest activity key against the last one the
   admin has seen (kept per-browser, purely a UI convenience). */
function actUnread(){
  if(!S.acts||!S.acts.length)return 0;
  let seen='';try{seen=localStorage.getItem('lb_actseen')||'';}catch(e){}
  return S.acts.filter(a=>(a.key||'')>seen).length;
}
