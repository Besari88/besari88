<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hegart Studio — A1 Poster</title>
<style>
  @font-face { font-family: "Outfit"; src: url(fonts/Outfit-Regular.ttf); font-weight: 400; }
  @font-face { font-family: "Outfit"; src: url(fonts/Outfit-Bold.ttf); font-weight: 700; }
  @font-face { font-family: "Serif"; src: url(fonts/InstrumentSerif-Regular.ttf); font-style: normal; }
  @font-face { font-family: "Serif"; src: url(fonts/InstrumentSerif-Italic.ttf); font-style: italic; }
  html, body { margin: 0; padding: 0; background: transparent; }
  #page { position: relative; width: 2245px; height: 3179px; overflow: hidden; font-family: "Outfit"; }
  #page.preview { background: repeating-linear-gradient(45deg, #c9c3bb 0 20px, #bdb6ad 20px 40px); }
  svg { position: absolute; left: 0; top: 0; }
  .t { position: absolute; margin: 0; white-space: nowrap; color: #1E2B3C; }
  .serif { font-family: "Serif"; font-style: italic; font-weight: 400; }
  .caps { font-size: 22px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 700; }
  .coral { color: #EE6A4D; }
  .muted { color: #6E7581; }
  .pill { display: inline-block; padding: 14px 30px; border-radius: 999px; font-size: 28px; }
</style>
</head>
<body>
<div id="page"></div>
<script>
const W = 2245, H = 3179, M = 96, CW = W - 2 * M;
const C = { bg: "#FBF7F2", ink: "#1E2B3C", coral: "#EE6A4D", peach: "#FCE3D8", blush: "#F7D3CC",
            sage: "#DDEBE2", sky: "#DDE9F5", sand: "#F3E6D3", muted: "#6E7581", white: "#FFFFFF" };
const GAP = 40;

// Band A — biometric focus (≈ 24 % of the sheet)
const aPanel = { x: M, y: 232, w: CW, h: 760, r: 56 };
const hero = { x: M + 64, y: 232 + 60, w: 480, h: Math.round(480 * 45 / 35), r: 26 };        // 35 × 45
// Band B — Bewerbung & LinkedIn (≈ 25 %)
const bTop = 1060, bH = 780;
const bX = M + 700, bW = (W - M - bX - GAP) / 2;
const bPhotos = [
  { x: bX, y: bTop, w: bW, h: bH - 40, r: 44 },
  { x: bX + bW + GAP, y: bTop + 40, w: bW, h: bH - 40, r: 44 },
];
// Band C — further services
const cTop = 2050, cH = 640, cStagger = 56;
const cW = (CW - 3 * GAP) / 4;
const cPhotos = [0, 1, 2, 3].map(i => ({ x: M + i * (cW + GAP), y: cTop + (i % 2) * cStagger, w: cW, h: cH, r: 40 }));
const fTop = 2940;

const holes = [hero, ...bPhotos, ...cPhotos];
const rr = (r, fill, extra = "") => `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${r.r || 0}" fill="${fill}" ${extra}/>`;

const preview = location.hash.includes("preview");
const page = document.getElementById("page");
if (preview) page.classList.add("preview");

let body = "";
body += `<rect width="${W}" height="${H}" fill="${C.bg}"/>`;
// soft decorative shapes
body += `<circle cx="${W - 60}" cy="120" r="260" fill="${C.sand}" opacity="0.7"/>`;
body += `<circle cx="-40" cy="1500" r="300" fill="${C.sage}" opacity="0.6"/>`;
// Band A panel
body += rr(aPanel, C.peach);
body += `<clipPath id="ap">${rr(aPanel, '#000')}</clipPath><circle cx="${aPanel.x + aPanel.w - 60}" cy="${aPanel.y + aPanel.h - 40}" r="260" fill="${C.blush}" opacity="0.8" clip-path="url(#ap)"/>`;
body += `<circle cx="${hero.x + hero.w + 10}" cy="${hero.y + 70}" r="120" fill="${C.coral}" opacity="0.9"/>`;
// Band B blob behind photos
body += `<rect x="${bX - 40}" y="${bTop + 120}" width="${W - 50 - bX + 40}" height="${bH - 60}" rx="60" fill="${C.sky}"/>`;
// Band C offset tiles behind each card
const tints = [C.blush, C.sand, C.peach, C.sage];
cPhotos.forEach((p, i) => body += rr({ x: p.x + 22, y: p.y + 22, w: p.w, h: p.h, r: p.r }, tints[i]));
// Footer band
body += `<rect x="0" y="${fTop}" width="${W}" height="${H - fTop}" fill="${C.coral}"/>`;
body += `<clipPath id="fp"><rect x="0" y="${fTop}" width="${W}" height="${H - fTop}"/></clipPath><circle cx="${W * 0.55}" cy="${H + 60}" r="300" fill="#F2826A" opacity="0.9" clip-path="url(#fp)"/><circle cx="${W - 40}" cy="${fTop}" r="120" fill="#F2826A" clip-path="url(#fp)"/>`;

let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
<defs><mask id="holes"><rect width="${W}" height="${H}" fill="#fff"/>${holes.map(h => rr(h, "#000")).join("")}</mask></defs>
<g mask="url(#holes)">${body}</g>`;

// biometric dimension marks (friendly, thin, coral)
const dim = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.coral}" stroke-width="3" stroke-linecap="round"/>`;
const hx2 = hero.x + hero.w, hy2 = hero.y + hero.h;
s += dim(hx2 + 30, hero.y, hx2 + 30, hy2) + dim(hx2 + 20, hero.y, hx2 + 40, hero.y) + dim(hx2 + 20, hy2, hx2 + 40, hy2);
s += dim(hero.x, hy2 + 26, hx2, hy2 + 26) + dim(hero.x, hy2 + 16, hero.x, hy2 + 36) + dim(hx2, hy2 + 16, hx2, hy2 + 36);
// soft white keyline around every photo
holes.forEach(h => s += `<rect x="${h.x - 7}" y="${h.y - 7}" width="${h.w + 14}" height="${h.h + 14}" rx="${h.r + 7}" fill="none" stroke="#fff" stroke-width="8"/>`);
s += `</svg>`;
page.insertAdjacentHTML("beforeend", s);

// ---------- typography ----------
const T = (html, css, cls = "") => {
  const el = document.createElement("div");
  el.className = "t " + cls; el.innerHTML = html;
  Object.assign(el.style, css); page.appendChild(el); return el;
};
const px = n => n + "px";
const R = el => el.getBoundingClientRect();
const fitW = (el, w) => { el.style.fontSize = px(parseFloat(el.style.fontSize) * w / R(el).width); return el; };

// header
T(`<span style="font-weight:700;font-size:58px;letter-spacing:0.08em">HEGART</span><span class="serif coral" style="font-size:58px;margin-left:14px">Studio</span>`, { left: px(M), top: px(92) });
T(`Fotografie · Grafikdesign · Marketing · Events`, { left: px(M + 470), top: px(118), fontSize: "26px" }, "muted");
T(`<span class="pill" style="background:#fff;font-weight:700;font-size:26px">hegart.de</span>`, { right: px(M), top: px(100) });

// Band A text
T(`${35} × ${45} mm`, { left: px(hero.x + hero.w / 2), top: px(hy2 + 40), transform: "translateX(-50%)", fontSize: "22px", fontWeight: 700, letterSpacing: "0.12em" }, "coral");
const AX = hx2 + 140, AW = aPanel.x + aPanel.w - 70 - AX;
T(`<span class="pill caps" style="background:${C.coral};color:#fff;font-size:22px;padding:12px 28px">★ Unser Schwerpunkt</span>`, { left: px(AX), top: px(aPanel.y + 64) });
const a1 = T(`Biometrische`, { left: px(AX), top: px(aPanel.y + 120), fontSize: "150px", lineHeight: "1" }, "serif");
const a2 = fitW(T(`Passfotos`, { left: px(AX - 6), top: px(R(a1).bottom - 34), fontSize: "200px", fontWeight: 700, lineHeight: "1", letterSpacing: "-0.03em" }), AW * 0.86);
const a3 = T(`für Reisepass, Personalausweis, Visum &amp; alle amtlichen Dokumente`, { left: px(AX), top: px(R(a2).bottom + 14), fontSize: "38px" });
const chips = ["Reisepass", "Personalausweis", "Visum", "Führerschein", "Aufenthaltstitel"];
const chipRow = T(chips.map(c => `<span class="pill" style="background:#fff;margin-right:14px;font-size:27px">${c}</span>`).join(""), { left: px(AX), top: px(R(a3).bottom + 34) });
const checks = ["35 × 45 mm", "ICAO-konform", "Digital &amp; gedruckt"];
T(checks.map(c => `<span style="display:inline-flex;align-items:center;margin-right:44px"><span style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:${C.coral};color:#fff;font-size:24px;font-weight:700;margin-right:14px">✓</span>${c}</span>`).join(""),
  { left: px(AX), top: px(R(chipRow).bottom + 34), fontSize: "32px", fontWeight: 700, display: "flex" });

// Band B text
const BX = M, BW = bX - M - 80;
T(`Portrait · Karriere`, { left: px(BX), top: px(bTop + 10) }, "caps coral");
const b1 = fitW(T(`Bewerbungs-`, { left: px(BX - 4), top: px(bTop + 56), fontSize: "120px", fontWeight: 700, lineHeight: "1", letterSpacing: "-0.02em" }), BW);
const b2 = T(`fotos &amp;`, { left: px(BX - 4), top: px(R(b1).bottom - 8), fontSize: b1.style.fontSize, fontWeight: 700, lineHeight: "1", letterSpacing: "-0.02em" });
const b3 = fitW(T(`LinkedIn-Portraits`, { left: px(BX), top: px(R(b2).bottom - 2), fontSize: "120px", lineHeight: "1" }, "serif coral"), BW);
const items = ["Bewerbung &amp; Karriere", "LinkedIn &amp; XING Profil", "Business-Porträts", "Team- &amp; Firmenfotos"];
items.forEach((d, i) => T(`<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${C.coral};margin-right:18px;vertical-align:4px"></span>${d}`,
  { left: px(BX), top: px(R(b3).bottom + 40 + i * 56), fontSize: "32px" }));
T(`„Der erste Eindruck zählt.“`, { left: px(BX), top: px(bTop + bH - 70), fontSize: "58px", lineHeight: "1" }, "serif");
const tag = (p, text) => T(`<span class="pill" style="background:#fff;font-weight:700;font-size:28px;box-shadow:0 6px 20px rgba(30,43,60,.18)">${text}</span>`,
  { left: px(p.x + 28), top: px(p.y + p.h - 92) });
tag(bPhotos[0], "Bewerbungsfoto");
tag(bPhotos[1], "LinkedIn · Business");

// Band C
const cHeadTop = 1904;
const c1 = T(`Mehr <span class="serif coral" style="font-size:112px">Momente,</span> die bleiben.`, { left: px(M), top: px(cHeadTop), fontSize: "92px", fontWeight: 700, lineHeight: "1", letterSpacing: "-0.02em" });
T(`Familie · Hochzeit · Marketing · Unternehmen`, { right: px(M), top: px(cHeadTop + 50), fontSize: "28px" }, "muted");
[["Baby &amp; Babybauch", "Schwangerschaft · Familie"],
 ["Hochzeit &amp; Events", "Trauung · Feiern · Firmenevents"],
 ["Marketing", "Kampagnen · Social Media"],
 ["Business-Ambiente", "Salon · Praxis · Office"]].forEach(([name, sub], i) => {
  const p = cPhotos[i];
  T(`<div style="font-weight:700;font-size:42px;letter-spacing:-0.01em">${name}</div><div class="muted" style="font-size:25px;margin-top:8px">${sub}</div>`,
    { left: px(p.x + 4), top: px(p.y + p.h + 44) });
});

// footer
const f1 = T(`HEGART <span class="serif" style="font-weight:400">Studio</span>`, { left: px(M), top: px(fTop + 58), fontSize: "120px", fontWeight: 700, lineHeight: "1", color: "#fff", letterSpacing: "0.02em" });
T(`Thurgauer Str. 5 · 78224 Singen (Hohentwiel)`, { left: px(M), top: px(R(f1).bottom + 18), fontSize: "32px", color: "#fff" });
T(`hegart.de`, { right: px(M), top: px(fTop + 50), fontSize: "96px", fontWeight: 700, lineHeight: "1", color: "#fff" });
T(`<span class="pill" style="background:#fff;color:${C.coral};font-weight:700;font-size:30px;padding:16px 36px">Jetzt Termin vereinbaren →</span>`, { right: px(M), top: px(fTop + 162) });

window.LAYOUT = { W, H, hero, bPhotos, cPhotos };
document.title = "ready";
</script>
</body>
</html>
